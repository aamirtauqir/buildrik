# Editor package CI gate.
#
# Catches the missing-module class of bug (CAN-001/002/003/004) where a feature
# branch lands referencing a file that was never committed. `vite build` is the
# authoritative check: Vite's import-analysis plugin fails the build if any
# imported module cannot be resolved, which is the exact failure mode that took
# down the editor on feat/media-tab-fully-functional.
#
# Tests also run as part of this gate.
#
# Why not `tsc --noEmit`: the editor's tsconfig currently picks up dashboard
# files via path aliases, so tsc surfaces pre-existing dashboard errors that
# aren't the editor PR's problem. Once that boundary is fixed, add a typecheck
# step here.
#
# Security note: this workflow uses no untrusted user input
# (no PR titles, issue bodies, commit messages, or branch names interpolated
# into shell commands). Only github.workflow (static) and github.ref (controlled
# by GitHub) are referenced, both inside the concurrency key.

name: editor

on:
  pull_request:
    paths:
      - "packages/editor/**"
      - "packages/shared/**"
      - "server/**"
      - "lib/**"
      - "__tests__/**"
      - "vitest.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/editor/**"
      - "packages/shared/**"
      - "server/**"
      - "lib/**"
      - "__tests__/**"
      - "vitest.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-ci.yml"

concurrency:
  group: editor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need HEAD's parent so the vocab-add gate can diff new --buildrick-*
          # tokens against the prior commit. Default fetch-depth:1 leaves HEAD
          # parentless, making `git show HEAD` treat every token as added.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bundle-drop guard: designer reference snapshots (HTML mocks, comp
      # previews, ui-kits) must live under docs/reference/, NOT inside the
      # editor source tree. A reference/ or project/ folder under
      # packages/editor/src signals a designer dropped a spec mirror back
      # into runtime — same failure mode that motivated the 2026-04-26
      # src/project/ relocation. Excludes node_modules/ and dist/ (vendor
      # packages legitimately ship reference folders). No untrusted input
      # is interpolated into the run block.
      - name: Reference snapshot guard
        run: |
          set -euo pipefail
          check_reference_drift() {
            find "$1" -path '*/node_modules' -prune -o \
                      -path '*/dist' -prune -o \
                      -type d \( -name 'reference' -o -name 'project' \) -print 2>/dev/null \
              | grep -q .
          }
          if check_reference_drift packages/editor/src; then
            echo "ERROR: Designer reference snapshot found inside packages/editor/src."
            echo "Move it to docs/reference/ (see .gitignore + bridge plan v2)."
            find packages/editor/src -path '*/node_modules' -prune -o \
                                     -path '*/dist' -prune -o \
                                     -type d \( -name 'reference' -o -name 'project' \) -print
            exit 1
          fi
          echo "Reference snapshot guard: PASS"

      # Authoritative gate: catches every unresolved import in the editor source
      # tree. This is the exact check that would have caught the missing
      # PinPopover, TemplateCard, useSectionInsert, and ../styles imports.
      - name: Build editor
        working-directory: packages/editor
        run: npx vite build

      - name: DS invariants (grep + baselines)
        working-directory: packages/editor
        run: pnpm run verify:ds

      - name: DS hex gate (WARN mode)
        working-directory: packages/editor
        run: pnpm run lint:ds-hex

      - name: Vibcoder-finish .buildrick-* gate (WARN mode)
        working-directory: packages/editor
        run: pnpm run gate:buildrick

      - name: DS SSOT gate (mechanical categories 1-4)
        working-directory: packages/editor
        run: pnpm run gate:ds-ssot

      - name: DS migrations fixture-pair gate
        working-directory: packages/editor
        run: pnpm run gate:ds-migrations

      - name: DS alias fixture-coverage gate
        working-directory: packages/editor
        run: pnpm run gate:ds-alias

      # Vocab sign-off gate: any commit that introduces a NEW --buildrick-*
      # token under themes/design-system/*.css must include a vocab-add: line
      # in its commit body (rule defined in TODOS.md "Vibcoder DS Bridge —
      # Define vocabulary expansion sign-off process"). Self-tested via
      # `scripts/check-vocab-add.sh --self-test`. Validates HEAD; PR merge
      # commits auto-skip via the merge-commit guard (intentional — solo
      # workflow direct to main is the enforced path). No untrusted input
      # interpolated into the run block.
      - name: DS vocab-add gate
        run: bash packages/editor/scripts/check-vocab-add.sh HEAD

      # ESLint is BLOCKING (D9, 2026-07-17). error-severity rules fail the
      # build: no-inline-hex (inline chrome hex must be a var(--buildrick-*)/
      # var(--bd-*) token or carry a `@lint-hex-policy:` annotation), plus
      # no-inspector-tokens, no-get-property-value-ds, no-dangerous-html, and
      # the engine/shared/services import-boundary rules. WARN-severity rules
      # (Chrome Axioms A1.1-A1.3, no-magic-layout-literals, exhaustive-deps)
      # stay advisory — eslint exits 0 on warnings, non-zero only on errors.
      # The grep gates (verify:ds, lint:ds-hex) remain the enforcement for the
      # WARN-baseline chrome axioms. Do not re-add `|| true`.
      - name: ESLint (blocking on errors)
        working-directory: packages/editor
        run: pnpm run lint

      - name: Run editor tests
        working-directory: packages/editor
        run: npx vitest run --reporter=default

      # Repo-root vitest run — exercises root vitest.config.ts which has its
      # own setupFiles + aliases + globs distinct from packages/editor's
      # config. Without this step, the 253-failure setupFiles regression
      # (fixed in a81ed8b1) would not be caught by CI — it's invisible to
      # packages/editor's vitest because the editor's own config is correct.
      # Includes server/, __tests__/, lib/, packages/shared/ test trees too.
      - name: Run repo-root tests
        run: npx vitest run --reporter=default

  # Browser-based checks live in their OWN job (added 2026-08-03).
  #
  # Two reasons it is not a step in build-and-test:
  #
  # 1. Budget. build-and-test is `timeout-minutes: 15` and already runs ~10
  #    gates, a production build, and 7,758 tests across two vitest configs.
  #    The conformance sweep alone is estimated at 15-20 minutes once every
  #    surface is measured, so bolting it on would blow the limit — a present
  #    contradiction, not a future one.
  # 2. Signal. A browser failure and a unit failure want different responses.
  #    Splitting them means the parity/conformance result is legible on its own
  #    and its artifacts have somewhere to land.
  #
  # What this fixes: `pnpm test:parity` appeared exactly once in the repo, at
  # packages/editor/package.json, and in no workflow and no git hook. The one
  # instrument that can see a `tw:` class had never run except by hand. Every
  # inline-style conversion in the drain shipped without it.
  #
  # BrowserStack: deliberately NOT configured. packages/editor/playwright.config.ts
  # THROWS if BROWSERSTACK_USERNAME/ACCESS_KEY are present, because the dashboard
  # config silently diverts to the paid grid when they are — which is how 81
  # dashboard tests once "passed" while being skipped. Do not add them here.
  browser:
    name: browser (parity + conformance)
    runs-on: ubuntu-latest
    # Room for the conformance sweep as waves land. Revisit if a full run
    # approaches this; the escape hatch is per-surface scoping (see
    # docs/plans/2026-08-03-editor-figma-conformance.md).
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --with-deps pulls the system libraries headless Chromium needs on a
      # bare ubuntu-latest runner. Without them the browser fails to launch and
      # measure.mjs exits 3 (it refuses to fall back to a system Chrome — see
      # e2e/lib/measure-lib.mjs), which is correct but unhelpful here.
      - name: Install Chromium
        working-directory: packages/editor
        run: pnpm exec playwright install --with-deps chromium

      # Computed-style parity against e2e/baselines/. Answers "did the rendered
      # result change since the last commit" — the safety net the inline-style
      # drain has been running without.
      - name: Style parity
        working-directory: packages/editor
        run: pnpm run test:parity

      # TODO (Phase 1.3): add the Figma conformance run here once the surface
      # recipes point at selectors that exist. `measure.mjs shell-default`
      # currently dies on `.bd-topbar`, which is in no file under src/, so
      # adding the step today would land CI red for a reason unrelated to any
      # change under review.

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-playwright-report
          path: |
            packages/editor/playwright-report/
            packages/editor/test-results/
            packages/editor/scripts/conformance/measured/
          retention-days: 7

# Editor package CI gate.
#
# Catches the missing-module class of bug (CAN-001/002/003/004) where a feature
# branch lands referencing a file that was never committed. `vite build` is the
# authoritative check: Vite's import-analysis plugin fails the build if any
# imported module cannot be resolved, which is the exact failure mode that took
# down the editor on feat/media-tab-fully-functional.
#
# Tests also run as part of this gate.
#
# Why not `tsc --noEmit`: the editor's tsconfig currently picks up dashboard
# files via path aliases, so tsc surfaces pre-existing dashboard errors that
# aren't the editor PR's problem. Once that boundary is fixed, add a typecheck
# step here.
#
# Security note: this workflow uses no untrusted user input
# (no PR titles, issue bodies, commit messages, or branch names interpolated
# into shell commands). Only github.workflow (static) and github.ref (controlled
# by GitHub) are referenced, both inside the concurrency key.

name: editor

on:
  pull_request:
    paths:
      - "packages/editor/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/editor/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-ci.yml"

concurrency:
  group: editor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bundle-drop guard: designer reference snapshots (HTML mocks, comp
      # previews, ui-kits) must live under docs/reference/, NOT inside the
      # editor source tree. A reference/ or project/ folder under
      # packages/editor/src signals a designer dropped a spec mirror back
      # into runtime — same failure mode that motivated the 2026-04-26
      # src/project/ relocation. Excludes node_modules/ and dist/ (vendor
      # packages legitimately ship reference folders). No untrusted input
      # is interpolated into the run block.
      - name: Reference snapshot guard
        run: |
          set -euo pipefail
          check_reference_drift() {
            find "$1" -path '*/node_modules' -prune -o \
                      -path '*/dist' -prune -o \
                      -type d \( -name 'reference' -o -name 'project' \) -print 2>/dev/null \
              | grep -q .
          }
          if check_reference_drift packages/editor/src; then
            echo "ERROR: Designer reference snapshot found inside packages/editor/src."
            echo "Move it to docs/reference/ (see .gitignore + bridge plan v2)."
            find packages/editor/src -path '*/node_modules' -prune -o \
                                     -path '*/dist' -prune -o \
                                     -type d \( -name 'reference' -o -name 'project' \) -print
            exit 1
          fi
          echo "Reference snapshot guard: PASS"

      # Authoritative gate: catches every unresolved import in the editor source
      # tree. This is the exact check that would have caught the missing
      # PinPopover, TemplateCard, useSectionInsert, and ../styles imports.
      - name: Build editor
        working-directory: packages/editor
        run: npx vite build

      - name: DS invariants (grep + baselines)
        working-directory: packages/editor
        run: pnpm run verify:ds

      - name: DS hex gate (WARN mode)
        working-directory: packages/editor
        run: pnpm run lint:ds-hex

      - name: Vibcoder-finish .buildrick-* gate (WARN mode)
        working-directory: packages/editor
        run: pnpm run gate:buildrick

      - name: DS SSOT gate (mechanical categories 1-4)
        working-directory: packages/editor
        run: pnpm run gate:ds-ssot

      - name: DS migrations fixture-pair gate
        working-directory: packages/editor
        run: pnpm run gate:ds-migrations

      - name: DS alias fixture-coverage gate
        working-directory: packages/editor
        run: pnpm run gate:ds-alias

      # Vocab sign-off gate: any commit that introduces a NEW --buildrick-*
      # token under themes/design-system/*.css must include a vocab-add: line
      # in its commit body (rule defined in TODOS.md "Vibcoder DS Bridge —
      # Define vocabulary expansion sign-off process"). Self-tested via
      # `scripts/check-vocab-add.sh --self-test`. Validates HEAD; PR merge
      # commits auto-skip via the merge-commit guard (intentional — solo
      # workflow direct to main is the enforced path). No untrusted input
      # interpolated into the run block.
      - name: DS vocab-add gate
        run: bash packages/editor/scripts/check-vocab-add.sh HEAD

      # ESLint runs advisory-only by design. DS V1 rules (no-inline-hex,
      # no-inspector-tokens, no-get-property-value-ds) and Chrome Axiom
      # rules (A1.1-A1.3) surface as IDE warnings; real enforcement lives
      # in the grep gates (verify:ds, lint:ds-hex) which ARE blocking.
      # See DESIGN.md Chrome Axioms - Enforcement. Do not remove || true
      # without also flipping WARN to FAIL on chrome-axiom baselines.
      - name: ESLint (DS rules, advisory)
        working-directory: packages/editor
        run: pnpm run lint || true

      - name: Run editor tests
        working-directory: packages/editor
        run: npx vitest run --reporter=default

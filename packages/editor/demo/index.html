<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buildrik Editor</title>
    <!--
      Canonical type stack per Figma "Buildrick — Product" foundations:
      Inter (UI) + Geist Mono (data). No system fallback names.
      Loaded from Bunny Fonts (privacy-respecting, no Google tracking).
    -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=inter:400,500,600|geist-mono:400,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        Pre-React body defaults — matches canonical --buildrick-* tokens from
        themes/design-system/color.css. Literal values here because this paints
        before default.css loads. Values MUST match the canonical DS V1 set.
        See DESIGN.md § Color.

        The universal reset is wrapped in `@layer reset` so vendored vibcoder
        atom rules (in @layer components) can override defaults like padding
        on .bd-btn, .bd-topbar__status, etc. Cascade order is finalized in
        themes/components/_layer.css: `@layer reset, tokens, components, overrides`.
      */
      @layer reset {
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { min-height: 100vh; }
      }
      body {
        font-family: 'Inter', 'Inter Tight', sans-serif;
        background: #F1F5F9;      /* --buildrick-bg-app */
        color: #0F172A;           /* --buildrick-ink */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

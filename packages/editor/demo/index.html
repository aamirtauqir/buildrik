<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buildrik Editor</title>
    <!--
      Canonical type stack per DESIGN.md:
      Inter Tight (UI) + Geist Mono (data). No system fallback names.
      Loaded from Bunny Fonts (privacy-respecting, no Google tracking).
    -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=inter-tight:400,500,600,700|geist-mono:400,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        Pre-React body defaults — matches canonical --aqb-* tokens from
        themes/default.css. Literal values here because this paints before
        default.css loads. Values MUST match the canonical token set.
        See DESIGN.md § Color.
      */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { min-height: 100vh; }
      body {
        font-family: 'Inter Tight', sans-serif;
        background: #F1F5F9;      /* --aqb-bg-app */
        color: #334155;           /* --aqb-text-primary */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Spinner + StatusDot — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/spinner.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .inline { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .label-row { display: inline-flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <h1>Vibcoder Spinner + StatusDot — Phase 1 side-by-side (two atoms, one file)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>spinner sizes (sm / default / lg)</h2>
      <div class="inline">
        <span class="bd-spinner bd-spinner--sm"></span>
        <span class="bd-spinner"></span>
        <span class="bd-spinner bd-spinner--lg"></span>
      </div>

      <h2>status dots (color via parent currentColor)</h2>
      <div class="inline">
        <span class="label-row" style="color: var(--buildrick-accent)">
          <span class="bd-status-dot bd-status-dot--pulse"></span>Connected
        </span>
        <span class="label-row" style="color: var(--buildrick-warning)">
          <span class="bd-status-dot"></span>Slow connection
        </span>
        <span class="label-row" style="color: var(--buildrick-error)">
          <span class="bd-status-dot"></span>Offline
        </span>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-spinner.tsx"></script>
</body>
</html>

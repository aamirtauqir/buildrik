<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Checkbox — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/checkbox.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .stack > * { display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Vibcoder Checkbox — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>sizes</h2>
      <div class="stack">
        <label class="bd-checkbox bd-checkbox--sm"><input type="checkbox" class="bd-checkbox__input" /><span class="bd-checkbox__label">sm</span></label>
        <label class="bd-checkbox"><input type="checkbox" class="bd-checkbox__input" /><span class="bd-checkbox__label">md (default)</span></label>
        <label class="bd-checkbox bd-checkbox--lg"><input type="checkbox" class="bd-checkbox__input" /><span class="bd-checkbox__label">lg</span></label>
      </div>

      <h2>states</h2>
      <div class="stack">
        <label class="bd-checkbox"><input type="checkbox" class="bd-checkbox__input" defaultChecked /><span class="bd-checkbox__label">checked</span></label>
        <label class="bd-checkbox bd-checkbox--error"><input type="checkbox" class="bd-checkbox__input" /><span class="bd-checkbox__label">error</span></label>
        <label class="bd-checkbox"><input type="checkbox" class="bd-checkbox__input" disabled /><span class="bd-checkbox__label">disabled</span></label>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-checkbox.tsx"></script>
</body>
</html>

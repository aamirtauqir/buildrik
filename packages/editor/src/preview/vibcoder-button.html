<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Button — POC gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/button.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Button — POC side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>variants × sizes</h2>
      <div class="row">
        <button class="bd-btn bd-btn--primary bd-btn--sm">primary sm</button>
        <button class="bd-btn bd-btn--primary bd-btn--md">primary md</button>
        <button class="bd-btn bd-btn--primary bd-btn--lg">primary lg</button>
      </div>
      <div class="row">
        <button class="bd-btn bd-btn--secondary bd-btn--md">secondary</button>
        <button class="bd-btn bd-btn--ghost bd-btn--md">ghost</button>
        <button class="bd-btn bd-btn--danger bd-btn--md">danger</button>
        <button class="bd-btn bd-btn--publish bd-btn--md">publish</button>
      </div>
      <div class="row">
        <button class="bd-btn bd-btn--primary bd-btn--md" disabled>disabled</button>
        <button class="bd-btn bd-btn--primary bd-btn--md bd-btn--busy">busy</button>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-button.tsx"></script>
</body>
</html>

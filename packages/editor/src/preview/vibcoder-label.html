<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Label — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/label.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/icon.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .stack { display: flex; flex-direction: column; gap: 16px; max-width: 360px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-mock { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Label — Phase 1 side-by-side (required + info sub-elements)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>default</h2>
      <div class="stack">
        <div class="field">
          <label class="bd-label" for="h1">Page title</label>
          <input id="h1" class="field-mock" value="Home" />
        </div>
      </div>

      <h2>required + info</h2>
      <div class="stack">
        <div class="field">
          <label class="bd-label" for="h2">
            Email
            <span class="bd-label__required" aria-hidden="true"></span>
            <button type="button" class="bd-label__info" aria-label="Email is used for password reset">
              <svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-info" /></svg>
            </button>
          </label>
          <input id="h2" type="email" class="field-mock" aria-required="true" />
        </div>
      </div>

      <h2>size = sm + inline</h2>
      <div class="stack">
        <div style="display: flex; gap: 8px; align-items: center;">
          <label class="bd-label bd-label--sm bd-label--inline" for="h3">Slug</label>
          <input id="h3" class="field-mock" value="/pricing" />
        </div>
      </div>

      <h2>disabled</h2>
      <div class="stack">
        <div class="field">
          <label class="bd-label" for="h4" data-disabled>API key (read-only)</label>
          <input id="h4" class="field-mock" value="sk_live_***" readonly />
        </div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-label.tsx"></script>
</body>
</html>

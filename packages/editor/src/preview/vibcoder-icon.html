<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Icon — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/icon.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bk-bg-panel, #fff); color: var(--bk-ink, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
    .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; }
    .icon-cell__name { font-size: 9px; font-family: ui-monospace, monospace; opacity: .5; }
  </style>
</head>
<body>
  <h1>Vibcoder Icon — Phase 1 side-by-side (sprite-backed)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className + sprite href)</h2>

      <h2>sizes (chevron-down)</h2>
      <div class="row">
        <svg class="bd-icon bd-icon--xs" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
        <svg class="bd-icon bd-icon--sm" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
        <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
        <svg class="bd-icon bd-icon--md" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
        <svg class="bd-icon bd-icon--lg" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
        <svg class="bd-icon bd-icon--xl" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg>
      </div>

      <h2>all 41 glyphs</h2>
      <div class="icon-grid">
        <div class="icon-cell"><svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-chevron-down" /></svg><span class="icon-cell__name">chevron-down</span></div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-icon.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Kbd — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/kbd.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .dark { background: var(--buildrick-stage-dark, #111); padding: 16px; border-radius: 6px; color: var(--buildrick-text-on-accent, #fff); }
  </style>
</head>
<body>
  <h1>Vibcoder Kbd — Phase 1 side-by-side (chip + sequence + inverted)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>default (light) — sm + xs</h2>
      <div class="row">
        <kbd class="bd-kbd">K</kbd>
        <kbd class="bd-kbd">⌘</kbd>
        <kbd class="bd-kbd bd-kbd--xs">esc</kbd>
      </div>

      <h2>bare (no chrome)</h2>
      <div class="row">
        <kbd class="bd-kbd bd-kbd--bare">⌘K</kbd>
        <kbd class="bd-kbd bd-kbd--bare bd-kbd--xs">/</kbd>
      </div>

      <h2>sequences — chord + then-separator</h2>
      <div class="stack">
        <div class="bd-kbd-seq">
          <kbd class="bd-kbd">⌘</kbd>
          <kbd class="bd-kbd">K</kbd>
        </div>
        <div class="bd-kbd-seq">
          <kbd class="bd-kbd">g</kbd>
          <span class="bd-kbd-seq__then">then</span>
          <kbd class="bd-kbd">p</kbd>
        </div>
      </div>

      <h2>inverted (on dark surface)</h2>
      <div class="dark">
        <p style="margin: 0; display: flex; gap: 8px; align-items: center;">
          Open command palette&nbsp;
          <span class="bd-kbd-seq">
            <kbd class="bd-kbd bd-kbd--inverted">⌘</kbd>
            <kbd class="bd-kbd bd-kbd--inverted">K</kbd>
          </span>
        </p>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-kbd.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder HelperText — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/helper-text.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .stack { display: flex; flex-direction: column; gap: 16px; max-width: 360px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-mock { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  </style>
</head>
<body>
  <h1>Vibcoder HelperText — Phase 1 side-by-side (4 tones)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>default (muted)</h2>
      <div class="stack">
        <div class="field">
          <input class="field-mock" value="Home" />
          <p class="bd-helper-text">Shown in browser tab and search results.</p>
        </div>
      </div>

      <h2>error</h2>
      <div class="stack">
        <div class="field">
          <input class="field-mock" value="Too short" />
          <p class="bd-helper-text bd-helper-text--error">Must be at least 70 characters.</p>
        </div>
      </div>

      <h2>success</h2>
      <div class="stack">
        <div class="field">
          <input class="field-mock" value="/pricing" />
          <p class="bd-helper-text bd-helper-text--success">Slug is available.</p>
        </div>
      </div>

      <h2>warning</h2>
      <div class="stack">
        <div class="field">
          <input class="field-mock" value="acme.dev" />
          <p class="bd-helper-text bd-helper-text--warning">DNS not yet verified — propagation can take up to 24h.</p>
        </div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-helper-text.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Slider — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/slider.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .stack { display: flex; flex-direction: column; gap: 24px; max-width: 320px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Slider — Phase 1 side-by-side (composite BEM render)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className, static demo)</h2>

      <h2>with label + unit</h2>
      <div class="stack">
        <div class="bd-slider">
          <div class="bd-slider__head">
            <span class="bd-slider__label">Opacity</span>
            <span class="bd-slider__value">86<span class="bd-slider__value-unit">%</span></span>
          </div>
          <div class="bd-slider__track">
            <div class="bd-slider__fill" style="width: 86%"></div>
            <div class="bd-slider__thumb" style="left: 86%"></div>
          </div>
        </div>

        <div class="bd-slider">
          <div class="bd-slider__head">
            <span class="bd-slider__label">Blur radius</span>
            <span class="bd-slider__value">24<span class="bd-slider__value-unit">px</span></span>
          </div>
          <div class="bd-slider__track">
            <div class="bd-slider__fill" style="width: 30%"></div>
            <div class="bd-slider__thumb" style="left: 30%"></div>
          </div>
        </div>
      </div>

      <h2>without head (track only)</h2>
      <div class="stack">
        <div class="bd-slider">
          <div class="bd-slider__track">
            <div class="bd-slider__fill" style="width: 50%"></div>
            <div class="bd-slider__thumb" style="left: 50%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper (controlled, with native input overlay)</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-slider.tsx"></script>
</body>
</html>

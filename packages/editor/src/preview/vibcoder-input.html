<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Input — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/input.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bk-bg-panel, #fff); color: var(--bk-ink, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .field { display: block; max-width: 280px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Vibcoder Input — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>variants</h2>
      <div class="field"><input class="bd-input" placeholder="default" /></div>
      <div class="field"><input class="bd-input bd-input--error" placeholder="error" defaultValue="bad" /></div>

      <h2>states</h2>
      <div class="field"><input class="bd-input" disabled placeholder="disabled" /></div>
      <div class="field"><input class="bd-input" type="number" defaultValue="42" /></div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-input.tsx"></script>
</body>
</html>

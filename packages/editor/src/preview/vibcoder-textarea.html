<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Textarea — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/textarea.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .field { display: block; max-width: 320px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Vibcoder Textarea — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>sizes</h2>
      <div class="field"><textarea class="bd-textarea bd-textarea--sm" placeholder="sm"></textarea></div>
      <div class="field"><textarea class="bd-textarea" placeholder="md (default)"></textarea></div>
      <div class="field"><textarea class="bd-textarea bd-textarea--lg" placeholder="lg"></textarea></div>

      <h2>states</h2>
      <div class="field"><textarea class="bd-textarea bd-textarea--error" placeholder="error">bad</textarea></div>
      <div class="field"><textarea class="bd-textarea bd-textarea--fixed" placeholder="fixed (no resize)"></textarea></div>
      <div class="field"><textarea class="bd-textarea" disabled placeholder="disabled"></textarea></div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-textarea.tsx"></script>
</body>
</html>

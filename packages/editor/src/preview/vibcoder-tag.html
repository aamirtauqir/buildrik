<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Tag — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/tag.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bk-bg-panel, #fff); color: var(--bk-ink, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Tag — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>variants</h2>
      <div class="row">
        <span class="bd-tag">neutral</span>
        <span class="bd-tag bd-tag--accent">accent</span>
        <span class="bd-tag bd-tag--success">success</span>
        <span class="bd-tag bd-tag--warning">warning</span>
        <span class="bd-tag bd-tag--error">error</span>
        <span class="bd-tag bd-tag--ink">ink</span>
      </div>

      <h2>sizes</h2>
      <div class="row">
        <span class="bd-tag bd-tag--sm">sm</span>
        <span class="bd-tag">md (default)</span>
      </div>

      <h2>states (selectable)</h2>
      <div class="row">
        <span class="bd-tag bd-tag--selectable">off</span>
        <span class="bd-tag bd-tag--selectable" aria-pressed="true">on (aria-pressed)</span>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-tag.tsx"></script>
</body>
</html>

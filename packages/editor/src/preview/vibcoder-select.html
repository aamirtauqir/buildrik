<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Select — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/select.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bk-bg-panel, #fff); color: var(--bk-ink, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
    .field { display: block; max-width: 240px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Vibcoder Select — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>sizes</h2>
      <div class="field">
        <div class="bd-select-wrap"><select class="bd-select bd-select--xs"><option>xs (24px)</option><option>two</option></select></div>
      </div>
      <div class="field">
        <div class="bd-select-wrap"><select class="bd-select bd-select--sm"><option>sm (28px)</option><option>two</option></select></div>
      </div>
      <div class="field">
        <div class="bd-select-wrap"><select class="bd-select"><option>md (default 32px)</option><option>two</option></select></div>
      </div>

      <h2>states</h2>
      <div class="field">
        <div class="bd-select-wrap"><select class="bd-select bd-select--error"><option>error</option></select></div>
      </div>
      <div class="field">
        <div class="bd-select-wrap"><select class="bd-select" disabled><option>disabled</option></select></div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-select.tsx"></script>
</body>
</html>

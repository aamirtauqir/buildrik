<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Progress — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/progress.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .stack { display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Progress — Phase 1 side-by-side (atoms + row composite)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>sizes (sm / md / lg) at 62%</h2>
      <div class="stack">
        <div class="bd-progress bd-progress--sm" style="--bdr-progress-value: 0.62" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
        <div class="bd-progress" style="--bdr-progress-value: 0.62" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
        <div class="bd-progress bd-progress--lg" style="--bdr-progress-value: 0.62" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
      </div>

      <h2>tones (default / success / warning / error)</h2>
      <div class="stack">
        <div class="bd-progress" style="--bdr-progress-value: 0.45" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
        <div class="bd-progress bd-progress--success" style="--bdr-progress-value: 1" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
        <div class="bd-progress bd-progress--warning" style="--bdr-progress-value: 0.78" role="progressbar" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
        <div class="bd-progress bd-progress--error" style="--bdr-progress-value: 0.92" role="progressbar" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
      </div>

      <h2>indeterminate (publishing pending)</h2>
      <div class="stack">
        <div class="bd-progress bd-progress--indeterminate" role="progressbar" aria-label="Publishing"><div class="bd-progress__bar"></div></div>
      </div>

      <h2>row composite — label + percent</h2>
      <div class="bd-progress-row" style="max-width: 360px">
        <div class="bd-progress-row__label">
          <span>Publishing 7 changes</span>
          <span class="bd-progress-row__pct">62%</span>
        </div>
        <div class="bd-progress" style="--bdr-progress-value: 0.62" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="bd-progress__bar"></div></div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-progress.tsx"></script>
</body>
</html>

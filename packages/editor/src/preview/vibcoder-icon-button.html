<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder IconButton — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/icon.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/icon-button.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder IconButton — Phase 1 side-by-side (Icon composition canary)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>sizes (ghost)</h2>
      <div class="row">
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost bd-icon-btn--xs" aria-label="Settings">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-settings" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost bd-icon-btn--sm" aria-label="Settings">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-settings" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost" aria-label="Settings">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-settings" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost bd-icon-btn--lg" aria-label="Settings">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-settings" /></svg>
        </button>
      </div>

      <h2>tones</h2>
      <div class="row">
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost" aria-label="More">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-more-horizontal" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--primary" aria-label="Add">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-plus" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--accent" aria-label="View">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-eye" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--danger" aria-label="Close">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-x" /></svg>
        </button>
      </div>

      <h2>states</h2>
      <div class="row">
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost" aria-label="Default">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-layers" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost" aria-pressed="true" aria-label="Pressed">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-eye" /></svg>
        </button>
        <button type="button" class="bd-icon-btn bd-icon-btn--ghost" disabled aria-label="Disabled">
          <svg class="bd-icon" aria-hidden="true"><use href="/src/themes/components/atoms/icons.svg#i-settings" /></svg>
        </button>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper (composes Icon child)</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-icon-button.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Count — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/count.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Count — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>variants (md)</h2>
      <div class="row">
        <span class="bd-count">3</span>
        <span class="bd-count bd-count--accent">9</span>
        <span class="bd-count bd-count--success">42</span>
        <span class="bd-count bd-count--warning">!</span>
        <span class="bd-count bd-count--error">!!</span>
        <span class="bd-count bd-count--ink">12</span>
      </div>

      <h2>sizes</h2>
      <div class="row">
        <span class="bd-count bd-count--xs">3</span>
        <span class="bd-count bd-count--sm">3</span>
        <span class="bd-count">3</span>
        <span class="bd-count bd-count--lg">3</span>
      </div>

      <h2>dot (xs / sm / md / lg)</h2>
      <div class="row">
        <span class="bd-count bd-count--dot bd-count--xs"></span>
        <span class="bd-count bd-count--dot bd-count--sm"></span>
        <span class="bd-count bd-count--dot"></span>
        <span class="bd-count bd-count--dot bd-count--lg"></span>
        <span class="bd-count bd-count--dot bd-count--accent"></span>
        <span class="bd-count bd-count--dot bd-count--error"></span>
      </div>

      <h2>inline (inside h3)</h2>
      <h3 style="font-size: 18px; margin: 0;">Drafts <span class="bd-count bd-count--inline bd-count--accent">7</span></h3>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-count.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Thumb — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/thumb.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Thumb — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>kinds (md)</h2>
      <div class="row">
        <div class="bd-thumb bd-thumb--placeholder"></div>
        <div class="bd-thumb bd-thumb--image"><img src="https://picsum.photos/240/140" alt="" /></div>
        <button class="bd-thumb bd-thumb--interactive" type="button">click me</button>
      </div>

      <h2>sizes (placeholder)</h2>
      <div class="row">
        <div class="bd-thumb bd-thumb--placeholder bd-thumb--sm"></div>
        <div class="bd-thumb bd-thumb--placeholder"></div>
        <div class="bd-thumb bd-thumb--placeholder bd-thumb--lg"></div>
      </div>

      <h2>ratios (placeholder)</h2>
      <div class="row">
        <div class="bd-thumb bd-thumb--placeholder bd-thumb--ratio-1-1"></div>
        <div class="bd-thumb bd-thumb--placeholder bd-thumb--ratio-16-9"></div>
        <div class="bd-thumb bd-thumb--placeholder bd-thumb--ratio-4-3"></div>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-thumb.tsx"></script>
</body>
</html>

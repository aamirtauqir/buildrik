<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Grip — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/grip.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/icon.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Grip — Phase 1 side-by-side (always-button + sprite Icon)</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>vertical sizes (sm / default / lg)</h2>
      <div class="row">
        <button type="button" class="bd-grip bd-grip--sm" aria-label="Drag (sm)"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
        <button type="button" class="bd-grip" aria-label="Drag"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
        <button type="button" class="bd-grip bd-grip--lg" aria-label="Drag (lg)"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
      </div>

      <h2>horizontal (rotated 90deg)</h2>
      <div class="row">
        <button type="button" class="bd-grip bd-grip--horizontal bd-grip--sm" aria-label="Drag row (sm)"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
        <button type="button" class="bd-grip bd-grip--horizontal" aria-label="Drag row"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
        <button type="button" class="bd-grip bd-grip--horizontal bd-grip--lg" aria-label="Drag row (lg)"><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
      </div>

      <h2>disabled</h2>
      <div class="row">
        <button type="button" class="bd-grip" aria-label="Cannot reorder" disabled><svg class="bd-icon"><use href="/src/themes/components/atoms/icons.svg#i-grip-vertical" /></svg></button>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-grip.tsx"></script>
</body>
</html>

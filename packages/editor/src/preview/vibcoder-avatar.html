<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vibcoder Avatar — Phase 1 gallery</title>
  <link rel="stylesheet" href="/src/themes/default.css" />
  <link rel="stylesheet" href="/src/themes/components/_aliases.generated.css" />
  <link rel="stylesheet" href="/src/themes/components/atoms/avatar.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--bd-bg-panel, #fff); color: var(--bd-fg-primary, #000); }
    h1 { font-size: 16px; margin: 0 0 16px; }
    h2 { font-size: 12px; margin: 24px 0 8px; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .col { border: 1px solid #ccc3; padding: 16px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Vibcoder Avatar — Phase 1 side-by-side</h1>
  <div class="grid">
    <div class="col">
      <h2>Vendored HTML (raw className)</h2>

      <h2>variants (md)</h2>
      <div class="row">
        <span class="bd-avatar">SK</span>
        <span class="bd-avatar bd-avatar--neutral">N</span>
        <span class="bd-avatar bd-avatar--ink">K</span>
        <span class="bd-avatar bd-avatar--success">S</span>
        <span class="bd-avatar bd-avatar--warning">W</span>
        <span class="bd-avatar bd-avatar--solid">X</span>
      </div>

      <h2>sizes</h2>
      <div class="row">
        <span class="bd-avatar bd-avatar--xs">S</span>
        <span class="bd-avatar bd-avatar--sm">SM</span>
        <span class="bd-avatar">MD</span>
        <span class="bd-avatar bd-avatar--lg">LG</span>
        <span class="bd-avatar bd-avatar--xl">XL</span>
      </div>

      <h2>presence dots</h2>
      <div class="row">
        <span class="bd-avatar">SK<span class="bd-avatar__presence bd-avatar__presence--online"></span></span>
        <span class="bd-avatar">SK<span class="bd-avatar__presence bd-avatar__presence--away"></span></span>
        <span class="bd-avatar">SK<span class="bd-avatar__presence bd-avatar__presence--offline"></span></span>
      </div>
    </div>

    <div class="col">
      <h2>React wrapper</h2>
      <div id="react-root"></div>
    </div>
  </div>
  <script type="module" src="./vibcoder-avatar.tsx"></script>
</body>
</html>

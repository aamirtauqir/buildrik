<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    Buildrik icon sprite — 30 symbols.
    Rules:
      - viewBox 0 0 16 16, stroke="currentColor", stroke-width 1.5, round caps/joins.
      - No hex. Only "currentColor" or "none". Filled glyphs use fill="currentColor".
      - Reference via <svg class="bdr-icon"><use href="…icons.svg#i-NAME" /></svg>
    Path resolution from a consumer:
      - From a screen at screens/foo.html  → "../components/atoms/icons.svg#i-NAME"
      - From an atom demo at components/atoms/foo.html → "./icons.svg#i-NAME"
      - From an organism at components/organisms/foo.html → "../atoms/icons.svg#i-NAME"
  -->

  <!-- ─── Chrome ───────────────────────────────────────────────────────── -->
  <symbol id="i-chevron-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6l4 4 4-4" />
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4l4 4-4 4" />
  </symbol>
  <symbol id="i-chevron-up" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10l4-4 4 4" />
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 4L6 8l4 4" />
  </symbol>
  <symbol id="i-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4l8 8M12 4l-8 8" />
  </symbol>
  <symbol id="i-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8.5l3 3 6-7" />
  </symbol>
  <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v10M3 8h10" />
  </symbol>
  <symbol id="i-minus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h10" />
  </symbol>
  <symbol id="i-more-horizontal" viewBox="0 0 16 16" fill="currentColor" stroke="none">
    <circle cx="3.5" cy="8" r="1.25" />
    <circle cx="8" cy="8" r="1.25" />
    <circle cx="12.5" cy="8" r="1.25" />
  </symbol>
  <symbol id="i-more-vertical" viewBox="0 0 16 16" fill="currentColor" stroke="none">
    <circle cx="8" cy="3.5" r="1.25" />
    <circle cx="8" cy="8" r="1.25" />
    <circle cx="8" cy="12.5" r="1.25" />
  </symbol>
  <symbol id="i-grip-vertical" viewBox="0 0 16 16" fill="currentColor" stroke="none">
    <circle cx="6" cy="3.5" r="1.1" />
    <circle cx="6" cy="8"   r="1.1" />
    <circle cx="6" cy="12.5" r="1.1" />
    <circle cx="10" cy="3.5" r="1.1" />
    <circle cx="10" cy="8"   r="1.1" />
    <circle cx="10" cy="12.5" r="1.1" />
  </symbol>

  <!-- ─── Editor rail ──────────────────────────────────────────────────── -->
  <symbol id="i-layers" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2L2 5l6 3 6-3-6-3z" />
    <path d="M2 11l6 3 6-3" />
    <path d="M2 8l6 3 6-3" />
  </symbol>
  <symbol id="i-pages" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2h4l3 3v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" />
    <path d="M9 2v3h3" />
  </symbol>
  <symbol id="i-components" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="5" height="5" rx="1" />
    <rect x="9" y="2" width="5" height="5" rx="1" />
    <rect x="2" y="9" width="5" height="5" rx="1" />
    <rect x="9" y="9" width="5" height="5" rx="1" />
  </symbol>
  <symbol id="i-media" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="12" height="10" rx="1.5" />
    <circle cx="6" cy="7" r="1.25" />
    <path d="M14 11l-3.5-3.5L4 13.5" />
  </symbol>
  <symbol id="i-palette" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2a6 6 0 1 0 0 12c.83 0 1.5-.67 1.5-1.5 0-.4-.16-.78-.44-1.06A1.5 1.5 0 0 1 10.13 9H12a2 2 0 0 0 2-2 5 5 0 0 0-5-5H8z" />
    <circle cx="5"  cy="7"  r="0.75" fill="currentColor" stroke="none" />
    <circle cx="8"  cy="5"  r="0.75" fill="currentColor" stroke="none" />
    <circle cx="11" cy="7"  r="0.75" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="i-settings" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="2" />
    <path d="M12.7 9.6a1 1 0 0 0 .2 1.1l.04.04a1.2 1.2 0 1 1-1.7 1.7l-.04-.04a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.92V13a1.2 1.2 0 1 1-2.4 0v-.06a1 1 0 0 0-.66-.92 1 1 0 0 0-1.1.2l-.04.04a1.2 1.2 0 1 1-1.7-1.7l.04-.04a1 1 0 0 0 .2-1.1 1 1 0 0 0-.92-.6H3a1.2 1.2 0 1 1 0-2.4h.06a1 1 0 0 0 .92-.66 1 1 0 0 0-.2-1.1l-.04-.04a1.2 1.2 0 1 1 1.7-1.7l.04.04a1 1 0 0 0 1.1.2h.04a1 1 0 0 0 .6-.92V3a1.2 1.2 0 1 1 2.4 0v.06a1 1 0 0 0 .6.92 1 1 0 0 0 1.1-.2l.04-.04a1.2 1.2 0 1 1 1.7 1.7l-.04.04a1 1 0 0 0-.2 1.1v.04a1 1 0 0 0 .92.6H13a1.2 1.2 0 1 1 0 2.4h-.06a1 1 0 0 0-.92.6z" />
  </symbol>
  <symbol id="i-history" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9" />
    <path d="M2.5 2.5v3h3" />
    <path d="M8 5v3l2 1.5" />
  </symbol>
  <symbol id="i-plus-square" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" />
    <path d="M8 5.5v5M5.5 8h5" />
  </symbol>

  <!-- ─── State / status ───────────────────────────────────────────────── -->
  <symbol id="i-circle" viewBox="0 0 16 16" fill="currentColor" stroke="none">
    <circle cx="8" cy="8" r="3" />
  </symbol>
  <symbol id="i-check-circle" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6" />
    <path d="M5 8.2l2 2 4-4.4" />
  </symbol>
  <symbol id="i-alert-circle" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6" />
    <path d="M8 5v3.5" />
    <circle cx="8" cy="11" r="0.6" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="i-info" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6" />
    <path d="M8 7.5V11" />
    <circle cx="8" cy="5.25" r="0.6" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="i-eye" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" />
    <circle cx="8" cy="8" r="2" />
  </symbol>
  <symbol id="i-eye-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 3l11 10" />
    <path d="M6.2 5.2C3.6 6.3 1.5 8 1.5 8s2.5 4.5 6.5 4.5c1.2 0 2.3-.3 3.2-.8" />
    <path d="M14.5 8s-1.1-2-3-3.4" />
    <path d="M9.6 9.7a2 2 0 0 1-2.8-2.8" />
  </symbol>

  <!-- ─── File / object ────────────────────────────────────────────────── -->
  <symbol id="i-image" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="12" height="10" rx="1.5" />
    <circle cx="5.75" cy="6.5" r="1" />
    <path d="M14 11l-3.5-3.5L4 13.5" />
  </symbol>
  <symbol id="i-file" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 1.5h5l3 3V14a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 4 14V2a.5.5 0 0 1 .5-.5z" />
    <path d="M9 1.5v3h3" />
  </symbol>
  <symbol id="i-folder" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 2H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4.5z" />
  </symbol>
  <symbol id="i-link" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 9.5L9.5 6.5" />
    <path d="M7.5 4.5l1-1a2.83 2.83 0 1 1 4 4l-1 1" />
    <path d="M8.5 11.5l-1 1a2.83 2.83 0 1 1-4-4l1-1" />
  </symbol>
  <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="9" height="9" rx="1.5" />
    <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" />
  </symbol>
  <symbol id="i-trash" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h11" />
    <path d="M6 4V2.75A.75.75 0 0 1 6.75 2h2.5a.75.75 0 0 1 .75.75V4" />
    <path d="M4 4l.7 9.05A1 1 0 0 0 5.7 14h4.6a1 1 0 0 0 1-.95L12 4" />
    <path d="M6.5 7v4M9.5 7v4" />
  </symbol>

  <!-- ─── Navigation / search ──────────────────────────────────────────── -->
  <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="7" r="4.5" />
    <path d="M10.5 10.5L13.5 13.5" />
  </symbol>
  <symbol id="i-arrow-up" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 13V3" />
    <path d="M4 7l4-4 4 4" />
  </symbol>
  <symbol id="i-arrow-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v10" />
    <path d="M4 9l4 4 4-4" />
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 7.5a5.5 5.5 0 1 0-1.6 4.4" />
    <path d="M13.5 2.5v4h-4" />
  </symbol>

  <!-- Close (alias of i-x; renders identical X) -->
  <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#i-x" />
  </symbol>

  <!-- Lock -->
  <symbol id="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="10" height="7" rx="1.5" />
    <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" />
  </symbol>

  <!-- Square (empty checkbox / toggle off / generic placeholder) -->
  <symbol id="i-square" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="10" height="10" rx="1.5" />
  </symbol>

  <!-- Undo (curved arrow swept counter-clockwise to the left) -->
  <symbol id="i-undo" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h7a3 3 0 0 1 0 6H7" />
    <path d="M5.5 5.5L3 8l2.5 2.5" />
  </symbol>

  <!-- Redo (mirror of undo, sweeps clockwise to the right) -->
  <symbol id="i-redo" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 8H6a3 3 0 0 0 0 6h3" />
    <path d="M10.5 5.5L13 8l-2.5 2.5" />
  </symbol>

  <!-- Share (node graph: 3 dots connected) -->
  <symbol id="i-share" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="3.5" r="1.8" />
    <circle cx="4" cy="8" r="1.8" />
    <circle cx="12" cy="12.5" r="1.8" />
    <path d="M5.5 7l5-2.5" />
    <path d="M5.5 9l5 2.5" />
  </symbol>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Buildrik · Editor UI kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"/>

<link rel="stylesheet" href="editor.css"/>
<style>
  html, body { margin:0; padding:0; height:100%; }

  .f  { fill: currentColor; opacity: 0.10; }
  .f2 { fill: currentColor; opacity: 0.20; }
  .f3 { fill: currentColor; opacity: 0.35; }

<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;

// ---------- generic stroke icon (for simple chrome glyphs) ----------
const I = ({ size=14, children, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>
);

      <path className="s" d="M10 14a4 4 0 0 1 0-5.7l2.7-2.7a4 4 0 0 1 5.7 5.7L17 12.7"/>
      <path className="s" d="M14 10a4 4 0 0 1 0 5.7l-2.7 2.7a4 4 0 0 1-5.7-5.7L7 11.3"/>

    case "embed": return (<svg {...P}>

      <path className="s" d="M6 10.5v3"/>

    case "textarea": return (<svg {...P}>
      <rect className="f" x="3" y="5" width="18" height="14" rx="1.5"/>
      <rect className="s" x="3" y="5" width="18" height="14" rx="1.5"/>
      <path className="s" d="M6 8h10"/>
      <path className="s2" d="M6 11h10 M6 13.5h8 M6 16h5"/>
    </svg>);
    case "select": return (<svg {...P}>
      <rect className="f" x="3" y="8" width="18" height="8" rx="1.5"/>
      <rect className="s" x="3" y="8" width="18" height="8" rx="1.5"/>
      <path className="s2" d="M6 12h8"/>
      <path className="f3" d="M16 11.5h3l-1.5 2z"/>
      <path className="s" d="M16 11.5h3l-1.5 2z"/>
    </svg>);
    case "checkbox": return (<svg {...P}>
      <rect className="f3" x="3" y="4" width="7" height="7" rx="1.5"/>
      <rect className="s" x="3" y="4" width="7" height="7" rx="1.5"/>
      <path className="s" d="M4.5 7.5l1.5 1.5L8.5 6.5" strokeWidth="1.75"/>

    case "toggle": return (<svg {...P}>
      <rect className="f3" x="3" y="8" width="18" height="8" rx="4"/>
      <rect className="s" x="3" y="8" width="18" height="8" rx="4"/>
      <circle fill="#fff" cx="16" cy="12" r="2.6"/>

    case "upload": return (<svg {...P}>
      <rect className="f" x="3" y="6" width="18" height="13" rx="1.5"/>
      <rect className="s" x="3" y="6" width="18" height="13" rx="1.5" strokeDasharray="3 2.5"/>
      <path className="s" d="M12 15V9 M9 12l3-3 3 3"/>
    </svg>);

    // Sections
    case "hero": return (<svg {...P}>
      <rect className="f" x="3" y="3" width="18" height="18" rx="2"/>
      <rect className="s" x="3" y="3" width="18" height="18" rx="2"/>
      <path className="s" d="M6 9h8"/>
      <path className="s2" d="M6 12h10 M6 14.5h7"/>
      <rect className="f3" x="6" y="16.5" width="5" height="2.5" rx="0.5"/>
      <rect className="s" x="6" y="16.5" width="5" height="2.5" rx="0.5"/>
      <rect className="s" x="12" y="16.5" width="5" height="2.5" rx="0.5" opacity="0.6"/>

    case "footer": return (<svg {...P}>
      <rect className="f" x="3" y="15" width="18" height="6" rx="1"/>
      <rect className="s" x="3" y="15" width="18" height="6" rx="1"/>
      <circle fill="currentColor" cx="6" cy="18" r="0.8"/>
      <path className="s2" d="M9 18h3 M14 18h2.5 M18 18h1.5"/>
      <rect className="s2" x="3" y="3" width="18" height="10" rx="1"/>
    </svg>);
    case "features": return (<svg {...P}>
      <rect className="f" x="3" y="5" width="5" height="14" rx="1"/>
      <rect className="f2" x="9.5" y="5" width="5" height="14" rx="1"/>
      <rect className="f" x="16" y="5" width="5" height="14" rx="1"/>
      <rect className="s" x="3" y="5" width="5" height="14" rx="1"/>
      <rect className="s" x="9.5" y="5" width="5" height="14" rx="1"/>
      <rect className="s" x="16" y="5" width="5" height="14" rx="1"/>
      <circle className="f3" cx="5.5" cy="8.5" r="1"/>
      <circle className="f3" cx="12" cy="8.5" r="1"/>
      <circle className="f3" cx="18.5" cy="8.5" r="1"/>
    </svg>);
    case "pricing": return (<svg {...P}>

      <rect className="f3" x="13" y="4" width="8" height="16" rx="1.5"/>
      <rect className="s" x="3" y="4" width="8" height="16" rx="1.5"/>
      <rect className="s" x="13" y="4" width="8" height="16" rx="1.5"/>
      <path className="s" d="M5 7.5h3 M15 7.5h3"/>
    </svg>);
    case "testimonial": return (<svg {...P}>
      <path className="f" d="M5 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3l-3 3v-3H7a2 2 0 0 1-2-2z"/>
      <path className="s" d="M5 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3l-3 3v-3H7a2 2 0 0 1-2-2z"/>

    case "cta": return (<svg {...P}>

      <rect className="s" x="13" y="12" width="8" height="9" rx="1"/>

    default: return null;
  }
};

// ---------- DUOTONE RAIL ICONS ----------
const RailIcon = ({ k }) => {
  const P = { width:18, height:18, viewBox:"0 0 24 24" };
  if (k==="add") return (<svg {...P}>
    <rect className="f" x="3" y="3" width="18" height="18" rx="3"/>
    <rect className="s" x="3" y="3" width="18" height="18" rx="3"/>
    <path className="s" d="M12 8v8 M8 12h8"/>
  </svg>);
  if (k==="layers") return (<svg {...P}>
    <rect className="f" x="3" y="4" width="14" height="4" rx="1"/>
    <rect className="s" x="3" y="4" width="14" height="4" rx="1"/>
    <rect className="s" x="7" y="10" width="14" height="4" rx="1"/>
    <rect className="s" x="3" y="16" width="14" height="4" rx="1"/>
  </svg>);
  if (k==="pages") return (<svg {...P}>
    <path className="f" d="M8 3h6l4 4v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
    <path className="s" d="M8 3h6l4 4v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
    <path className="s" d="M14 3v4h4"/>
  </svg>);
  if (k==="templates") return (<svg {...P}>
    <rect className="f" x="3" y="3" width="8" height="8" rx="1.5"/>
    <rect className="s" x="3" y="3" width="8" height="8" rx="1.5"/>
    <rect className="s" x="13" y="3" width="8" height="8" rx="1.5"/>
    <rect className="s" x="3" y="13" width="8" height="8" rx="1.5"/>
    <rect className="f" x="13" y="13" width="8" height="8" rx="1.5"/>
    <rect className="s" x="13" y="13" width="8" height="8" rx="1.5"/>
  </svg>);
  if (k==="ai") return (<svg {...P}>
    <path className="f" d="M12 3l2.1 5.4 5.4 2.1-5.4 2.1L12 18l-2.1-5.4L4.5 10.5l5.4-2.1z"/>
    <path className="s" d="M12 3l2.1 5.4 5.4 2.1-5.4 2.1L12 18l-2.1-5.4L4.5 10.5l5.4-2.1z"/>
  </svg>);
  if (k==="settings") return (<svg {...P}>
    <circle className="f" cx="12" cy="12" r="3"/>
    <circle className="s" cx="12" cy="12" r="3"/>
    <path className="s" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>);
};

// ---------- TOPBAR ----------
function Topbar() {
  const [bp, setBp] = useState("desktop");
  return (
    <header className="top">
      <div className="brand">
        <div className="mark">B</div>
        <div className="name">Buildrik</div>
        <I size={12}><path d="M6 9l6 6 6-6"/></I>
      </div>
      <div className="group">
        <button className="btn icon" title="Undo"><I><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H8"/></I></button>
        <button className="btn icon" title="Redo"><I><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v0a6 6 0 0 0 6 6h6"/></I></button>
        <button className="btn icon" title="History"><I><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></I></button>
      </div>
      <div className="divider"/>
      <div className="title">
        <span>Marketing site</span><span className="slash">/</span><span className="page">Home</span>
        <I size={12} style={{color:"var(--bd-fg-muted)"}}><path d="M6 9l6 6 6-6"/></I>
      </div>
      <div className="group bp-group">
        {[
          {k:"desktop", body:<I><rect x="2" y="4" width="20" height="12" rx="2"/><path d="M8 20h8 M12 16v4"/></I>},
          {k:"tablet",  body:<I><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 18h.01"/></I>},
          {k:"mobile",  body:<I><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></I>},
        ].map(b => (
          <button key={b.k} className={"btn icon" + (bp===b.k?" bp-on":"")} onClick={()=>setBp(b.k)} title={b.k}>
            {b.body}
          </button>
        ))}
      </div>
      <div className="divider"/>
      <span className="badge saved"><span className="dot" style={{background:"var(--bd-success)"}}/>Saved · 2m</span>
      <div className="group">
        <button className="btn secondary"><I><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></I>Preview</button>
        <button className="btn publish">Publish</button>
      </div>
    </header>
  );
}

// ---------- LEFT RAIL ----------
function LeftRail({ active, onChange }) {
  const items = ["add","layers","pages","templates","ai","settings"];
  return (
    <nav className="rail">
      {items.map(k => (
        <button key={k} className={active===k?"on":""} onClick={()=>onChange(k)} title={k}>
          <RailIcon k={k}/>
        </button>
      ))}
    </nav>
  );
}

// ---------- SIDEBAR PANEL ----------
const BLOCK_CATS = [
  { h:"Layout",   items:[
    {n:"Section",k:"section"},{n:"Container",k:"container"},{n:"Flex",k:"flex"},
    {n:"Grid",k:"grid"},{n:"2 cols",k:"cols2"},{n:"3 cols",k:"cols3"},
    {n:"Spacer",k:"spacer"},{n:"Divider",k:"divider"},
  ]},
  { h:"Basic",    items:[
    {n:"Heading",k:"heading"},{n:"Paragraph",k:"paragraph"},{n:"Button",k:"button"},
    {n:"Link",k:"link"},{n:"Image",k:"image"},{n:"Video",k:"video"},
    {n:"Rich text",k:"richtext"},{n:"Embed",k:"embed"},
  ]},
  { h:"Forms",    items:[
    {n:"Input",k:"input"},{n:"Textarea",k:"textarea"},{n:"Select",k:"select"},
    {n:"Checkbox",k:"checkbox"},{n:"Toggle",k:"toggle"},{n:"Upload",k:"upload"},
  ]},
  { h:"Sections", items:[
    {n:"Hero",k:"hero"},{n:"Navbar",k:"navbar"},{n:"Features",k:"features"},
    {n:"Pricing",k:"pricing"},{n:"Testimonial",k:"testimonial"},{n:"CTA",k:"cta"},
    {n:"Blog grid",k:"blog"},{n:"Footer",k:"footer"},
  ]},
];

function SidebarPanel({ active }) {
  const titles = { add:"Add", layers:"Layers", pages:"Pages", templates:"Templates", ai:"AI assistant", settings:"Settings" };
  const counts = { add:"30 blocks", layers:"9 nodes", pages:"6 pages", templates:"12 templates", ai:"", settings:"" };
  return (
    <section className="panel">
      <div className="panel-h">
        <div>
          <h2>{titles[active]}</h2>
          {counts[active] && <div className="panel-sub">{counts[active]}</div>}
        </div>
        <button className="btn icon" title="New"><I><path d="M12 5v14 M5 12h14"/></I></button>
      </div>
      {active === "add" && <>
        <label className="panel-search">
          <I size={13}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></I>
          <input placeholder="Search 30 blocks"/>
          <span className="kbd">⌘K</span>
        </label>
        <div className="panel-body">
          {BLOCK_CATS.map(cat => (
            <div key={cat.h}>
              <div className="cat-h">
                <span>{cat.h}</span>
                <span className="cat-n">{cat.items.length}</span>
              </div>
              <div className="block-grid">
                {cat.items.map(it => (
                  <div key={it.n} className="block-card">
                    <BlockIcon k={it.k} size={22}/>
                    <span>{it.n}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </>}
      {active === "layers" && <LayersList/>}
      {active === "pages"  && <PagesList/>}
      {active !== "add" && active !== "layers" && active !== "pages" && (
        <div className="panel-body" style={{padding:"20px 12px", color:"var(--bd-fg-secondary)", fontSize:12.5}}>
          No content for <b>{active}</b> in this kit preview.
        </div>
      )}
    </section>
  );
}

// Eye icon for layer visibility
const Eye = ({ off }) => off
  ? (<svg width="13" height="13" viewBox="0 0 24 24"><path className="s" d="M1 1l22 22 M6.7 6.7A10 10 0 0 0 1 12s4 8 11 8a10 10 0 0 0 5.3-1.7 M10 6a10 10 0 0 1 2-.2c7 0 11 8 11 8a18 18 0 0 1-2.6 3.6"/></svg>)
  : (<svg width="13" height="13" viewBox="0 0 24 24"><path className="s" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle className="s" cx="12" cy="12" r="3"/></svg>);

const Chev = ({ open }) => (
  <svg width="10" height="10" viewBox="0 0 24 24" style={{transform:open?"rotate(0)":"rotate(-90deg)", transition:"120ms"}}>
    <path fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" d="M6 9l6 6 6-6"/>
  </svg>
);

function LayersList() {
  const rows = [
    { depth:0, n:"Body", k:"container", expanded:true },
    { depth:1, n:"Navbar", k:"navbar", vis:true },
    { depth:1, n:"Hero · section", k:"hero", vis:true, selected:true, expanded:true },
    { depth:2, n:"Eyebrow", k:"heading", vis:true, leaf:true },
    { depth:2, n:"Heading", k:"heading", vis:true, leaf:true },
    { depth:2, n:"Paragraph", k:"paragraph", vis:true, leaf:true },
    { depth:2, n:"CTA group", k:"flex", vis:true },
    { depth:1, n:"Features · grid", k:"features", vis:true },
    { depth:1, n:"Footer", k:"footer", vis:false },
  ];
  return (
    <div className="panel-body" style={{padding:"8px 6px"}}>
      {rows.map((r, k) => (
        <div key={k} className={"lr" + (r.selected?" sel":"") + (r.vis===false?" hidden":"")}
             style={{paddingLeft: 8 + (r.depth*14)}}>
          {r.leaf
            ? <span style={{width:10, display:"inline-block"}}/>
            : <span className="lr-chev"><Chev open={r.expanded}/></span>}
          <span className="lr-ic"><BlockIcon k={r.k} size={13}/></span>
          <span className="lr-nm">{r.n}</span>
          <span className={"lr-eye" + (r.vis===false?" off":"")}><Eye off={r.vis===false}/></span>
        </div>
      ))}
    </div>
  );
}

function PagesList() {
  const pages = [
    { n:"Home",     slug:"/",         home:true, pub:true },
    { n:"Pricing",  slug:"/pricing",  pub:true },
    { n:"Features", slug:"/features", pub:true },
    { n:"Blog",     slug:"/blog",     pub:true, folder:true },
    { n:"About",    slug:"/about",    pub:false },
    { n:"Contact",  slug:"/contact",  pub:true },
  ];
  return (
    <div className="panel-body" style={{padding:"10px 8px"}}>
      <button className="btn secondary" style={{width:"calc(100% - 4px)", justifyContent:"center", marginBottom:8}}>
        <I size={12}><path d="M12 5v14 M5 12h14"/></I>Add page
      </button>
      {pages.map((p, k) => (
        <div key={k} className="pg" style={{background: k===0 ? "var(--bd-bg-subtle)" : "transparent"}}>
          <I size={14} style={{color:"var(--bd-fg-muted)", flexShrink:0}}>
            {p.folder
              ? <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              : <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></>}
          </I>
          <div style={{flex:1, minWidth:0}}>
            <div className="pg-n">{p.n}
              {p.home && <span className="pg-home">HOME</span>}
            </div>
            <div className="pg-s">{p.slug}</div>
          </div>
          <span className={"pg-dot " + (p.pub?"on":"off")}/>
        </div>
      ))}
    </div>
  );
}

// ---------- CANVAS ----------
function Canvas() {
  return (
    <main className="canvas">
      <div className="artboard">
        <div className="art-nav">
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <div style={{width:24, height:24, background:"var(--bd-accent)", borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", font:"700 12px var(--bd-font)", letterSpacing:"-0.04em"}}>A</div>
            Acme
          </div>
          <div className="links"><span>Features</span><span>Pricing</span><span>Customers</span><span>Docs</span></div>
          <div className="cta">Start free</div>
        </div>
        <section className="art-hero selected-hero">
          <span className="eyebrow">New · v2.0</span>
          <h1>Ship production sites in an afternoon</h1>
          <p>Buildrik pairs a fast visual canvas with the control of a real CSS engine. Design, connect your data, and publish to a global edge — no re-platforming later.</p>
          <div className="btns">
            <div className="pri">Start building</div>
            <div className="sec">Watch the tour</div>
          </div>
        </section>
        <div className="art-features">
          {[
            {t:"Visual, not opinionated", d:"Flex, grid, position — every layout tool you know, exposed without magic abstractions.", k:"grid"},
            {t:"Componentize anything",   d:"Turn any element into a reusable component with overridable props, no refactor required.", k:"templates"},
            {t:"Ship without surprises",  d:"Preview every breakpoint, lint your semantics, then deploy to a global CDN in one click.", k:"ai"},
          ].map((f,i) => (
            <div key={i} className="art-feat">
              <div className="ficon">{f.k==="grid" ? <BlockIcon k="grid" size={16}/> : <RailIcon k={f.k}/>}</div>
              <h3>{f.t}</h3>
              <p>{f.d}</p>
            </div>
          ))}
        </div>
      </div>
    </main>
  );
}

// ---------- INSPECTOR ----------
function Inspector() {
  const [tab, setTab] = useState("layout");
  return (
    <aside className="insp">
      <div className="insp-h">
        <div className="el">
          <BlockIcon k="hero" size={14}/>
          Hero
          <span className="tag">section</span>
        </div>
        <button className="btn icon"><I size={12}><path d="M12 5v14 M5 12h14"/></I></button>
      </div>
      <div className="insp-tabs">
        {["layout","style","effects","cms"].map(t => (
          <button key={t} className={tab===t?"on":""} onClick={()=>setTab(t)}>
            {t[0].toUpperCase()+t.slice(1)}
          </button>
        ))}
      </div>
      <div className="insp-body">
        {tab === "layout" && <LayoutTab/>}
        {tab === "style" && <AppearanceTab/>}
        {tab === "effects" && <div className="insp-sec" style={{color:"var(--bd-fg-secondary)", fontSize:12}}>No effects applied. <a style={{color:"var(--bd-accent)", cursor:"pointer"}}>Add effect</a></div>}
        {tab === "cms" && <div className="insp-sec" style={{color:"var(--bd-fg-secondary)", fontSize:12}}>Not bound to a collection. <a style={{color:"var(--bd-accent)", cursor:"pointer"}}>Bind data</a></div>}
      </div>
    </aside>
  );
}

function LayoutTab() {
  return (<>
    <div className="insp-sec">
      <h4>Display</h4>
      <div className="seg">
        {[
          {k:"block", body:<I size={12}><rect x="3" y="3" width="18" height="18" rx="2"/></I>},
          {k:"flex",  body:<I size={12}><path d="M3 6h18 M3 12h12 M3 18h6"/></I>, on:true},
          {k:"grid",  body:<I size={12}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></I>},
          {k:"none",  body:<I size={12}><path d="M18 6L6 18 M6 6l12 12"/></I>},
        ].map(o => (
          <button key={o.k} className={o.on?"on":""}>{o.body}{o.k}</button>
        ))}
      </div>
    </div>

    <div className="insp-sec">
      <h4>Size</h4>
      <div className="field-row"><div className="lb">W</div>
        <div className="num-input"><input defaultValue="100"/><span className="unit">%</span></div>
      </div>
      <div className="field-row"><div className="lb">H</div>
        <div className="num-input"><input defaultValue="auto" style={{textAlign:"left", fontFamily:"var(--bd-font)", color:"var(--bd-fg-muted)"}}/></div>
      </div>
      <div className="field-row"><div className="lb">Max W</div>
        <div className="num-input"><input defaultValue="1200"/><span className="unit">px</span></div>
      </div>
    </div>

    <div className="insp-sec">
      <h4>Padding <span className="x">link</span></h4>
      <div className="quad">
        <div className="num-input q-t" data-axis="T"><input defaultValue="64"/><span className="unit">px</span></div>
        <div className="num-input q-r" data-axis="R"><input defaultValue="32"/><span className="unit">px</span></div>
        <div className="num-input q-b" data-axis="B"><input defaultValue="72"/><span className="unit">px</span></div>
        <div className="num-input q-l" data-axis="L"><input defaultValue="32"/><span className="unit">px</span></div>
      </div>
    </div>

    <div className="insp-sec">
      <h4>Flex</h4>
      <div className="field-row"><div className="lb">Dir</div>
        <div className="seg" style={{gridAutoColumns:"1fr 1fr"}}>
          <button>Row</button><button className="on">Col</button>
        </div>
      </div>
      <div className="field-row"><div className="lb">Align</div>
        <div className="seg" style={{gridAutoColumns:"1fr 1fr 1fr"}}>
          <button>Start</button><button className="on">Center</button><button>End</button>
        </div>
      </div>
      <div className="field-row"><div className="lb">Gap</div>
        <div className="num-input"><input defaultValue="16"/><span className="unit">px</span></div>
      </div>
    </div>
  </>);
}

function AppearanceTab() {
  return (<>
    <div className="insp-sec">
      <h4>Background</h4>
      <div className="field-row"><div className="lb">Color</div>
        <div className="color-field">
          <div className="sw" style={{background:"#FFFFFF"}}/>
          <div className="hx">#FFFFFF</div>
          <div className="pct">100%</div>
        </div>
      </div>
      <div className="field-row"><div className="lb">Image</div>
        <button className="btn secondary" style={{width:"100%", justifyContent:"center"}}>
          <I size={11}><path d="M12 5v14 M5 12h14"/></I>Add image
        </button>
      </div>
    </div>
    <div className="insp-sec">
      <h4>Typography</h4>
      <div className="field-row"><div className="lb">Font</div>
        <input className="text-input" defaultValue="Inter Tight"/>
      </div>
      <div className="field-row"><div className="lb">Size</div>
        <div className="num-input"><input defaultValue="17"/><span className="unit">px</span></div>
      </div>
      <div className="field-row"><div className="lb">Color</div>
        <div className="color-field">
          <div className="sw" style={{background:"#0F172A"}}/>
          <div className="hx">#0F172A</div>
          <div className="pct">100%</div>
        </div>
      </div>
    </div>
    <div className="insp-sec">
      <h4>Border</h4>
      <div className="field-row"><div className="lb">Radius</div>
        <div className="num-input"><input defaultValue="0"/><span className="unit">px</span></div>
      </div>
      <div className="field-row"><div className="lb">Width</div>
        <div className="num-input"><input defaultValue="0"/><span className="unit">px</span></div>
      </div>
    </div>
    <div className="insp-sec">
      <h4>Shadow</h4>
      <div className="switch"><span className="track off"><span className="thumb"/></span>Apply shadow</div>
    </div>
  </>);
}

// ---------- FOOTER ----------
function Footer() {
  return (
    <footer className="foot">
      <div className="l">
        <span><span className="dot"/> Connected · main</span>
        <span>body › section.hero</span>
      </div>
      <div className="r">
        <span>1024 × 768</span>
        <span>100%</span>
        <span>v2.14.0</span>
      </div>
    </footer>
  );
}

// ---------- SHELL ----------
function EditorShell() {
  const [rail, setRail] = useState("add");
  return (
    <div className="ed-shell">
      <Topbar/>
      <LeftRail active={rail} onChange={setRail}/>
      <SidebarPanel active={rail}/>
      <Canvas/>
      <Inspector/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EditorShell/>);
</script>
</body>
</html>

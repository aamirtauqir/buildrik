<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .group {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--bd-bg-subtle);
    border-radius: 8px;
    border: 1px solid var(--bd-border);
  }
  .bp {
    width: 34px; height: 28px;
    border-radius: 6px; border: 0; cursor: pointer; background: transparent;
    color: var(--bd-fg-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 120ms cubic-bezier(0.4,0,0.2,1);
  }
  .bp:hover { background: rgba(15,23,42,0.04); color: var(--bd-fg-primary); }
  .bp.on {
    background: #fff; color: var(--bd-accent);
    box-shadow: 0 1px 2px rgba(15,23,42,0.08);
  }
  .labelled {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--bd-bg-subtle); border-radius: 8px; border: 1px solid var(--bd-border);
  }
  .labelled .bp {
    width: auto; padding: 0 10px; gap: 6px;
    font: 500 12px var(--bd-font);
  }
  .spec {
    font: 500 11px var(--bd-mono); color: var(--bd-fg-muted);
  }
  .spec strong { color: var(--bd-fg-primary); font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .lbl { font-size: 10px; color: var(--bd-fg-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
</style>
</head><body><div class="card">
  <div class="lbl">Breakpoint switcher · iconed</div>
  <div class="bar">
    <div class="group" role="tablist">
      <button class="bp on" title="Desktop · 1440"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8 M12 16v4"/></svg></button>
      <button class="bp" title="Tablet · 768"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="18" r="0.8" fill="currentColor"/></svg></button>
      <button class="bp" title="Mobile · 375"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    </div>
    <span class="spec">active: <strong>desktop</strong> · 1440</span>
  </div>

  <div class="lbl" style="margin-top:16px">Labelled variant (settings drawer)</div>
  <div class="bar">
    <div class="labelled" role="tablist">
      <button class="bp on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8 M12 16v4"/></svg>
        Desktop
      </button>
      <button class="bp">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/></svg>
        Tablet
      </button>
      <button class="bp">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/></svg>
        Mobile
      </button>
    </div>
  </div>

  <div class="lbl" style="margin-top:16px">Breakpoint tokens</div>
  <div class="col" style="gap:4px">
    <span class="spec"><strong>desktop</strong> &nbsp; min-width: 1024px · artboard 1440</span>
    <span class="spec"><strong>tablet</strong> &nbsp; 768–1023px · artboard 768</span>
    <span class="spec"><strong>mobile</strong> &nbsp; &lt; 768px · artboard 375</span>
  </div>
</div></body></html>

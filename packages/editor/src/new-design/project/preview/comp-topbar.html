<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .topbar {
    height: 48px;
    background: #fff;
    border: 1px solid var(--bd-border);
    border-radius: 10px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .grp { display: inline-flex; align-items: center; gap: 6px; }
  .brand {
    font: 700 14px var(--bd-font);
    color: var(--bd-fg-heading);
    letter-spacing: -0.01em;
    padding-right: 10px;
    border-right: 1px solid var(--bd-border);
    margin-right: 2px;
  }
  .ic-btn {
    width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer;
    color: var(--bd-fg-secondary);
  }
  .ic-btn:hover { background: rgba(15,23,42,0.04); color: var(--bd-fg-primary); }
  .ic-btn.on  { background: var(--bd-accent-tint); color: var(--bd-accent); }
  .sep { width: 1px; height: 18px; background: var(--bd-border); margin: 0 4px; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 12px var(--bd-font); color: var(--bd-fg-secondary);
    padding: 4px 10px; border-radius: 6px; background: var(--bd-bg-subtle);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bd-success); }
  .breakpoints {
    display: inline-flex; padding: 2px;
    background: var(--bd-bg-subtle);
    border-radius: 8px;
  }
  .bp { width: 30px; height: 26px; border-radius: 6px; display:inline-flex; align-items:center; justify-content:center; color: var(--bd-fg-secondary); border:0; background:transparent; cursor:pointer; }
  .bp.on { background: #fff; color: var(--bd-accent); box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
  .pill-pub {
    height: 32px; padding: 0 14px;
    border-radius: 9999px;
    background: var(--bd-accent); color: #fff;
    font: 600 12.5px var(--bd-font);
    border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill-pub:hover { background: var(--bd-accent-hover); }
  svg { flex-shrink: 0; }
  .lbl { font-size: 10px; color: var(--bd-fg-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
</style>
</head><body><div class="card">
  <div class="lbl">Topbar · 48px</div>
  <div class="topbar">
    <div class="grp">
      <span class="brand">Buildrik</span>
      <button class="ic-btn" title="Dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="sep"></div>
      <button class="ic-btn" title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v0a5 5 0 01-5 5H9"/></svg></button>
      <button class="ic-btn" title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 00-5 5v0a5 5 0 005 5h6"/></svg></button>
      <div class="sep"></div>
      <span class="status"><span class="dot"></span>Saved</span>
    </div>

    <div class="grp" style="justify-self:center">
      <div class="breakpoints">
        <button class="bp on" title="Desktop"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8 M12 16v4"/></svg></button>
        <button class="bp" title="Tablet"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="18" r="0.8" fill="currentColor"/></svg></button>
        <button class="bp" title="Mobile"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
      </div>
    </div>

    <div class="grp">
      <button class="ic-btn" title="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="ic-btn" title="Share"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4 M8.6 13.5l6.8 4"/></svg></button>
      <div class="sep"></div>
      <button class="pill-pub">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-7 18 7-3 7 3z"/></svg>
        Publish
      </button>
    </div>
  </div>

  <div class="lbl" style="margin-top:8px">Status variants</div>
  <div class="row" style="gap:10px; flex-wrap:wrap">
    <span class="status"><span class="dot"></span>Saved</span>
    <span class="status"><span class="dot" style="background:var(--bd-warning)"></span>Saving&hellip;</span>
    <span class="status"><span class="dot" style="background:var(--bd-fg-muted)"></span>Offline</span>
    <span class="status"><span class="dot" style="background:var(--bd-error)"></span>8 unsaved changes</span>
  </div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #EEF2F7; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 20px 8px 12px; }
  .r { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 84px; height: 60px; background: #FFFFFF; border-radius: 10px; }
  .nm  { font: 600 11px var(--bd-font); color: var(--bd-fg-heading); }
  .px  { font: 500 10px var(--bd-mono); color: var(--bd-fg-muted); }
</style>
</head><body><div class="card">
  <div class="row">
    <div class="r"><div class="box" style="box-shadow: 0 1px 2px rgba(15,23,42,0.04)"></div><div class="nm">xs</div><div class="px">hairline</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04)"></div><div class="nm">sm</div><div class="px">inputs</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 4px 12px rgba(15,23,42,0.06), 0 2px 4px rgba(15,23,42,0.04)"></div><div class="nm">md</div><div class="px">dropdowns</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 8px 24px rgba(15,23,42,0.08), 0 4px 8px rgba(15,23,42,0.05)"></div><div class="nm">lg</div><div class="px">popovers</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 16px 40px rgba(15,23,42,0.10), 0 8px 16px rgba(15,23,42,0.06)"></div><div class="nm">xl</div><div class="px">menus</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 8px 32px rgba(15,23,42,0.08)"></div><div class="nm">modal</div><div class="px">modals</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 0 0 3px rgba(45,109,255,0.12); background:#FFFFFF"></div><div class="nm">glow cta</div><div class="px">focus</div></div>
    <div class="r"><div class="box" style="box-shadow: 0 0 0 4px rgba(45,109,255,0.08)"></div><div class="nm">glow sel</div><div class="px">selection</div></div>
  </div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F8FAFC; }
  .card-ex {
    background: #fff; border: 1px solid var(--bd-border); border-radius: 10px; padding: 0;
    overflow: hidden; box-shadow: 0 4px 12px rgba(15,23,42,0.06), 0 2px 4px rgba(15,23,42,0.04);
  }
  .card-head {
    padding: 10px 14px; border-bottom: 1px solid var(--bd-border);
    font: 600 13px var(--bd-font); color: var(--bd-fg-heading); display: flex; align-items: center; justify-content: space-between;
  }
  .card-body { padding: 14px; font: 400 12.5px/1.55 var(--bd-font); color: var(--bd-fg-secondary); }
  .card-foot { padding: 10px 14px; border-top: 1px solid var(--bd-border); background: var(--bd-bg-subtle); display: flex; justify-content: flex-end; gap: 8px; }
  .mini { font: 500 11px var(--bd-font); padding: 4px 10px; border-radius: 6px; background: #fff; border: 1px solid var(--bd-border-medium); color: var(--bd-fg-primary); cursor: pointer; }
  .mini.p { background: var(--bd-accent); border-color: var(--bd-accent); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .flush { background: #fff; border: 1px solid var(--bd-border); border-radius: 10px; padding: 14px; }
  .flush .t { font: 600 13px var(--bd-font); color: var(--bd-fg-heading); margin-bottom: 4px; }
  .flush .d { font: 400 12px var(--bd-font); color: var(--bd-fg-secondary); }
</style>
</head><body><div class="card">
  <div class="grid">
    <div class="card-ex">
      <div class="card-head">SEO settings <span style="font:500 11px var(--bd-mono); color:var(--bd-fg-muted)">/home</span></div>
      <div class="card-body">Meta title and description appear in search results and social previews.</div>
      <div class="card-foot">
        <button class="mini">Cancel</button>
        <button class="mini p">Save</button>
      </div>
    </div>
    <div class="flush">
      <div class="t">Flush card</div>
      <div class="d">Used inside panels where the surrounding surface already has chrome. No shadow, 1px border, 10px radius.</div>
    </div>
  </div>
</div></body></html>

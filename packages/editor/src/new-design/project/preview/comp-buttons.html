<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; font: 500 13px var(--bd-font); line-height: 1.2;
    border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    transition: all 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .primary   { background: var(--bd-accent); color: #fff; }
  .primary:hover { background: var(--bd-accent-hover); }
  .secondary { background: #fff; border-color: var(--bd-border-medium); color: var(--bd-fg-primary); }
  .secondary:hover { background: var(--bd-bg-subtle); border-color: var(--bd-border-medium); }
  .ghost     { background: transparent; color: var(--bd-fg-secondary); }
  .ghost:hover { background: rgba(15,23,42,0.04); color: var(--bd-fg-primary); }
  .danger    { background: #fff; border-color: rgba(220,38,38,0.30); color: var(--bd-error); }
  .publish   { background: var(--bd-accent); color: #fff; border-radius: 9999px; padding: 9px 18px; font-weight: 600; }
  .sm  { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .lg  { padding: 12px 22px; font-size: 14px; }
  svg  { flex-shrink: 0; }
</style>
</head><body><div class="card">
  <div class="row">
    <button class="btn primary">Publish</button>
    <button class="btn secondary">Preview</button>
    <button class="btn ghost">Cancel</button>
    <button class="btn danger">Delete</button>
  </div>
  <div class="row" style="margin-top:4px">
    <button class="btn publish">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2L4.5 20.29l7.5-3 7.5 3L12 2z"/></svg>
      Publish site
    </button>
    <button class="btn secondary sm">Add page</button>
    <button class="btn primary lg">Apply template</button>
  </div>
</div></body></html>

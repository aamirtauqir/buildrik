<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F8FAFC; }
  .tabs { display: flex; gap: 4px; padding: 8px 8px 0; background: #fff; border: 1px solid var(--bd-border); border-radius: 10px; }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 12px; font: 500 12px var(--bd-font); color: var(--bd-fg-secondary);
    background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    transition: 120ms;
  }
  .tab:hover { color: var(--bd-fg-primary); background: var(--bd-bg-subtle); }
  .tab.active { color: var(--bd-fg-primary); background: var(--bd-bg-subtle); border-bottom-color: var(--bd-accent); font-weight: 600; }
  .pill-group { display: inline-flex; background: #fff; border: 1px solid var(--bd-border-medium); border-radius: 8px; overflow: hidden; }
  .pill-group button { padding: 6px 12px; font: 500 12px var(--bd-font); background: transparent; border: none; border-left: 1px solid var(--bd-border); color: var(--bd-fg-secondary); cursor: pointer; }
  .pill-group button:first-child { border-left: none; }
  .pill-group button.on { background: var(--bd-bg-subtle); color: var(--bd-fg-primary); font-weight: 600; }
  .sw { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--bd-font); color: var(--bd-fg-primary); }
  .track { position: relative; width: 36px; height: 20px; background: var(--bd-accent); border-radius: 9999px; }
  .thumb { position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(15,23,42,0.2); }
  .track.off { background: #CBD5E1; }
  .track.off .thumb { left: 2px; }
  .sw-row { display: flex; gap: 20px; align-items: center; }
</style>
</head><body><div class="card">
  <div class="tabs">
    <button class="tab"><span>Add</span></button>
    <button class="tab active"><span>Layers</span></button>
    <button class="tab"><span>Pages</span></button>
    <button class="tab"><span>Media</span></button>
  </div>
  <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:2px">
    <div class="pill-group">
      <button>Desktop</button>
      <button class="on">Tablet</button>
      <button>Mobile</button>
    </div>
    <div class="sw-row">
      <div class="sw"><span class="track"><span class="thumb"></span></span>Show grid</div>
      <div class="sw" style="color:var(--bd-fg-secondary)"><span class="track off"><span class="thumb"></span></span>Snap</div>
    </div>
  </div>
</div></body></html>

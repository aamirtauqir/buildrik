<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #FFFFFF; }
  .logo-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--bd-bg-panel); border: 1px solid var(--bd-border); border-radius: 12px; }
  .mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: #2D6DFF;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 16px var(--bd-font);
    letter-spacing: -0.04em;
    box-shadow: 0 1px 2px rgba(29, 78, 216, 0.25);
  }
  .word { font: 700 20px var(--bd-font); letter-spacing: -0.02em; color: var(--bd-fg-heading); }
  .sub { font: 500 11px var(--bd-font); color: var(--bd-fg-muted); margin-left: auto; }
  .dark { background: #0F172A; border-color: #0F172A; }
  .dark .word { color: #FFFFFF; }
  .dark .sub { color: #94A3B8; }
  .row { display: flex; gap: 12px; flex-direction: column; }
  .flag { font: 500 10.5px var(--bd-font); color: var(--bd-warning); background: rgba(217,119,6,0.06); border: 1px dashed rgba(217,119,6,0.40); padding: 6px 10px; border-radius: 6px; }
</style>
</head><body><div class="card">
  <div class="row">
    <div class="logo-row">
      <div class="mark">B</div>
      <div class="word">Buildrik</div>
      <div class="sub">text wordmark · Inter Tight 700</div>
    </div>
    <div class="logo-row dark">
      <div class="mark">B</div>
      <div class="word">Buildrik</div>
      <div class="sub">dark surface</div>
    </div>
    <div class="flag">⚠ Brand logo SVG not found in codebase. Placeholder B-mark in cobalt shown. Please share an official mark.</div>
  </div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .footer {
    height: 32px;
    background: #fff;
    border: 1px solid var(--bd-border);
    border-radius: 8px;
    padding: 0 12px;
    display: flex; align-items: center; justify-content: space-between;
    font: 500 11px var(--bd-font);
    color: var(--bd-fg-secondary);
  }
  .grp { display: inline-flex; align-items: center; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 4px;
    background: var(--bd-bg-subtle);
    font-family: var(--bd-mono); font-size: 10.5px;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--bd-success); }
  .ic { color: var(--bd-fg-muted); display:inline-flex; align-items:center; }
  .ic:hover { color: var(--bd-fg-primary); cursor: pointer; }
  .sep { width: 1px; height: 14px; background: var(--bd-border); margin: 0 4px; }
  .lbl { font-size: 10px; color: var(--bd-fg-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
</style>
</head><body><div class="card">
  <div class="lbl">Footer · 32px · status + zoom + meta</div>

  <div class="stack">
    <div class="footer">
      <div class="grp">
        <span class="chip"><span class="dot"></span>Saved</span>
        <span>index.html</span>
        <span class="sep"></span>
        <span>24 pages</span>
        <span class="sep"></span>
        <span>1 issue</span>
      </div>
      <div class="grp">
        <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 12h8"/></svg></span>
        <span class="chip">100%</span>
        <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 8v8 M8 12h8"/></svg></span>
        <span class="sep"></span>
        <span class="chip">1440 × auto</span>
      </div>
    </div>

    <div class="footer">
      <div class="grp">
        <span class="chip"><span class="dot" style="background:var(--bd-warning)"></span>Saving&hellip;</span>
        <span>about.html</span>
      </div>
      <div class="grp">
        <span class="chip">75%</span>
        <span class="chip">768 × auto</span>
      </div>
    </div>

    <div class="footer">
      <div class="grp">
        <span class="chip"><span class="dot" style="background:var(--bd-error)"></span>Couldn't save</span>
        <span style="color: var(--bd-error)">Retry</span>
      </div>
      <div class="grp">
        <span class="chip">50%</span>
        <span class="chip">375 × auto</span>
      </div>
    </div>
  </div>
</div></body></html>

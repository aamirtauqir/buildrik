<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: flex-start; }
  .col2 { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: 500 11px/1.2 var(--bd-font); color: var(--bd-fg-secondary); letter-spacing: 0.02em; }
  .inp { width: 100%; padding: 8px 12px; font: 400 13px var(--bd-font); color: var(--bd-fg-primary);
    background: #fff; border: 1px solid var(--bd-border-medium); border-radius: 8px;
    outline: none; transition: all 120ms; }
  .inp:focus { border-color: var(--bd-accent); box-shadow: 0 0 0 3px rgba(45,109,255,0.08); }
  .inp::placeholder { color: var(--bd-fg-muted); }
  .err { border-color: var(--bd-error); box-shadow: 0 0 0 3px rgba(220,38,38,0.10); }
  .hint { font: 500 11px var(--bd-font); color: var(--bd-fg-muted); }
  .err-hint { font: 500 11px var(--bd-font); color: var(--bd-error); }
  .stepper { display: flex; flex:1; background: #fff; border: 1px solid var(--bd-border-medium); border-radius: 8px; overflow: hidden; }
  .stepper button { width: 30px; background: transparent; border: none; color: var(--bd-fg-muted); cursor: pointer; font: 600 14px var(--bd-font); }
  .stepper button:hover { background: rgba(15,23,42,0.04); color: var(--bd-fg-primary); }
  .stepper input { flex: 1; min-width: 40px; padding: 8px 4px; border: none; outline: none; font: 500 13px var(--bd-mono); text-align: center; color: var(--bd-fg-primary); }
  .unit { padding: 0 10px; font: 500 11px var(--bd-mono); color: var(--bd-fg-muted); display: flex; align-items: center; border-left: 1px solid var(--bd-border); }
</style>
</head><body><div class="card">
  <div class="grid">
    <div class="col2">
      <div class="lbl">Page title</div>
      <input class="inp" value="Home" />
      <div class="hint">Shown in browser tab</div>
    </div>
    <div class="col2">
      <div class="lbl">Slug</div>
      <input class="inp" placeholder="/pricing" />
    </div>
    <div class="col2">
      <div class="lbl">Meta description</div>
      <input class="inp err" value="This description is way too short" />
      <div class="err-hint">Must be at least 70 characters</div>
    </div>
    <div class="col2">
      <div class="lbl">Padding top</div>
      <div class="stepper"><button>−</button><input value="24" /><span class="unit">px</span><button>+</button></div>
    </div>
  </div>
</div></body></html>

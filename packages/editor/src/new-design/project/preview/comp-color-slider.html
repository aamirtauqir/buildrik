<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F8FAFC; }
  .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: stretch; }
  .block {
    background: #fff;
    border: 1px solid var(--bd-border);
    border-radius: 12px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .t    { font: 600 11px var(--bd-font); color: var(--bd-fg-secondary); letter-spacing: 0.04em; text-transform: uppercase; }
  .meta { font: 500 10.5px var(--bd-mono); color: var(--bd-fg-muted); font-variant-numeric: tabular-nums; }

  /* ---- COLOR PICKER ---- */
  .hue-spectrum {
    position: relative;
    height: 120px; border-radius: 10px;
    background:
      linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0)),
      linear-gradient(to right, #fff, rgba(45,109,255,0)),
      #2D6DFF;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08);
  }
  .picker {
    position: absolute;
    left: 62%; top: 22%;
    width: 14px; height: 14px; border-radius: 50%;
    background: transparent; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(15,23,42,0.25), 0 1px 3px rgba(0,0,0,0.3);
    transform: translate(-50%, -50%);
  }
  .strip {
    height: 10px; border-radius: 9999px; position: relative;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08);
  }
  .strip.hue {
    background: linear-gradient(to right, #FF0000, #FFFF00, #00FF00, #00FFFF, #0000FF, #FF00FF, #FF0000);
  }
  .strip.alpha {
    background:
      linear-gradient(to right, rgba(45,109,255,0) 0%, rgba(45,109,255,1) 100%),
      repeating-conic-gradient(#CBD5E1 0% 25%, #fff 0% 50%) 50% / 8px 8px;
  }
  .strip .pill {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 18px; border-radius: 4px;
    background: #fff; border: 1.5px solid #0F172A;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .strip.hue .pill { left: 62%; }
  .strip.alpha .pill { left: 86%; }

  .swatch-row { display: flex; align-items: center; gap: 8px; }
  .big-sw {
    width: 36px; height: 36px; border-radius: 8px;
    background: #2D6DFF;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.10);
    flex-shrink: 0;
  }
  .hex-input {
    flex: 1; display: flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 10px;
    background: var(--bd-bg-subtle); border: 1px solid transparent; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .hex-input .pfx { font: 500 12px var(--bd-font); color: var(--bd-fg-muted); }
  .hex-input .val { font: 500 12.5px var(--bd-font); color: var(--bd-fg-primary); letter-spacing: 0.01em; }
  .mode {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    background: var(--bd-bg-subtle); border-radius: 6px; padding: 2px;
    font: 500 10.5px var(--bd-font); color: var(--bd-fg-secondary); height: 32px;
    width: 100px;
  }
  .mode button { border: none; background: transparent; border-radius: 4px; cursor: pointer; color: inherit; }
  .mode button.on { background: #fff; color: var(--bd-fg-heading); font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,0.08); }

  .rgb { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 2px; }
  .rgb .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .rgb .cell .v { width: 100%; height: 26px; background: var(--bd-bg-subtle); border-radius: 4px; display: flex; align-items: center; justify-content: center; font: 500 11px var(--bd-font); color: var(--bd-fg-primary); font-variant-numeric: tabular-nums; }
  .rgb .cell .k { font: 600 9px var(--bd-font); letter-spacing: 0.08em; color: var(--bd-fg-muted); }

  .swatches-row { display: flex; gap: 4px; }
  .ss { width: 20px; height: 20px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08); cursor: pointer; }
  .ss.on { box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08), 0 0 0 2px #fff, 0 0 0 4px var(--bd-accent); }

  /* ---- SLIDER ---- */
  .slider-stack { display: flex; flex-direction: column; gap: 14px; }
  .sld-group { display: flex; flex-direction: column; gap: 8px; }
  .sld-head { display: flex; align-items: baseline; justify-content: space-between; }
  .sld-label { font: 500 11.5px var(--bd-font); color: var(--bd-fg-primary); }
  .sld-value {
    display: inline-flex; align-items: baseline; gap: 2px;
    font: 600 12.5px var(--bd-font); color: var(--bd-fg-heading); font-variant-numeric: tabular-nums;
  }
  .sld-value .u { font-weight: 500; font-size: 10.5px; color: var(--bd-fg-muted); }
  .track2 {
    position: relative; width: 100%; height: 4px;
    background: var(--bd-bg-subtle); border-radius: 9999px;
  }
  .track2 .fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--bd-accent); border-radius: 9999px; }
  .track2 .thumb {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1.5px var(--bd-accent), 0 1px 3px rgba(15,23,42,0.15);
    cursor: grab;
  }
  .track2 .thumb::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bd-accent);
  }
  .ticks { display: flex; justify-content: space-between; font: 500 9.5px var(--bd-mono); color: var(--bd-fg-muted); margin-top: 2px; }

  /* Steppers row */
  .steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .step {
    display: flex; align-items: center; height: 28px;
    background: var(--bd-bg-subtle); border: 1px solid transparent; border-radius: 5px;
    overflow: hidden;
  }
  .step .k { font: 600 9.5px var(--bd-font); letter-spacing: 0.06em; color: var(--bd-fg-muted); text-transform: uppercase; padding: 0 0 0 8px; }
  .step input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: 500 11.5px var(--bd-font); color: var(--bd-fg-primary); text-align: right; padding: 0 2px; font-variant-numeric: tabular-nums; }
  .step .u { font: 500 10px var(--bd-font); color: var(--bd-fg-muted); padding: 0 8px 0 2px; }
</style>
</head><body><div class="card">
  <div class="wrap">

    <!-- COLOR PICKER -->
    <div class="block">
      <div class="head">
        <span class="t">Color</span>
        <span class="meta">sRGB · 8-bit</span>
      </div>

      <div class="hue-spectrum"><div class="picker"></div></div>

      <div class="strip hue"><div class="pill"></div></div>
      <div class="strip alpha"><div class="pill"></div></div>

      <div class="swatch-row">
        <div class="big-sw"></div>
        <div class="hex-input">
          <span class="pfx">#</span>
          <span class="val">2D6DFF</span>
          <span class="meta" style="margin-left:auto">86%</span>
        </div>
        <div class="mode"><button class="on">Hex</button><button>RGB</button><button>HSL</button></div>
      </div>

      <div class="rgb">
        <div class="cell"><span class="k">R</span><span class="v">45</span></div>
        <div class="cell"><span class="k">G</span><span class="v">109</span></div>
        <div class="cell"><span class="k">B</span><span class="v">255</span></div>
        <div class="cell"><span class="k">A</span><span class="v">86</span></div>
      </div>

      <div style="display:flex; align-items:center; gap:8px; margin-top:2px">
        <span class="t" style="letter-spacing:0.06em">Recent</span>
        <div class="swatches-row">
          <div class="ss on" style="background:#2D6DFF"></div>
          <div class="ss" style="background:#0F172A"></div>
          <div class="ss" style="background:#16A34A"></div>
          <div class="ss" style="background:#DC2626"></div>
          <div class="ss" style="background:#D97706"></div>
          <div class="ss" style="background:#94A3B8"></div>
          <div class="ss" style="background:#FFFFFF"></div>
        </div>
      </div>
    </div>

    <!-- SLIDERS + STEPPERS -->
    <div class="block">
      <div class="head">
        <span class="t">Sliders</span>
        <span class="meta">drag · ←/→ · ⇧</span>
      </div>

      <div class="slider-stack">
        <div class="sld-group">
          <div class="sld-head">
            <span class="sld-label">Opacity</span>
            <span class="sld-value">86<span class="u">%</span></span>
          </div>
          <div class="track2"><div class="fill" style="width:86%"></div><div class="thumb" style="left:86%"></div></div>
          <div class="ticks"><span>0</span><span>50</span><span>100</span></div>
        </div>

        <div class="sld-group">
          <div class="sld-head">
            <span class="sld-label">Blur radius</span>
            <span class="sld-value">24<span class="u">px</span></span>
          </div>
          <div class="track2"><div class="fill" style="width:30%"></div><div class="thumb" style="left:30%"></div></div>
        </div>

        <div class="sld-group">
          <div class="sld-head">
            <span class="sld-label">Rotation</span>
            <span class="sld-value">−12<span class="u">°</span></span>
          </div>
          <div class="track2" style="background: linear-gradient(90deg, var(--bd-bg-subtle) 0 49%, var(--bd-border-medium) 49% 51%, var(--bd-bg-subtle) 51% 100%)">
            <div class="fill" style="left:38%; width:12%;"></div>
            <div class="thumb" style="left:38%"></div>
          </div>
          <div class="ticks"><span>−180°</span><span>0</span><span>180°</span></div>
        </div>

        <div class="steppers">
          <div class="step">
            <span class="k">min</span>
            <input value="0"/>
            <span class="u">px</span>
          </div>
          <div class="step">
            <span class="k">max</span>
            <input value="100"/>
            <span class="u">px</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row-item { display: grid; grid-template-columns: 160px 1fr 90px; align-items: center; gap: 16px; padding: 8px 12px; border-radius: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .lbl { display: flex; align-items: center; gap: 10px; font: 600 13px var(--bd-font); color: var(--bd-fg-heading); }
  .sample { font: 500 12px var(--bd-font); padding: 6px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid; }
  .hex { font: 500 11px var(--bd-mono); color: var(--bd-fg-muted); text-align: right; }
</style>
</head><body><div class="card">
  <div class="rows">
    <div class="row-item" style="background:rgba(220,38,38,0.05)">
      <div class="lbl"><span class="dot" style="background:#DC2626"></span>Error</div>
      <div><span class="sample" style="background:rgba(220,38,38,0.10); border-color:rgba(220,38,38,0.30); color:#DC2626">3 issues</span></div>
      <div class="hex">#DC2626</div>
    </div>
    <div class="row-item" style="background:rgba(22,163,74,0.10)">
      <div class="lbl"><span class="dot" style="background:#16A34A"></span>Success</div>
      <div><span class="sample" style="background:rgba(22,163,74,0.10); border-color:rgba(22,163,74,0.30); color:#16A34A">Published</span></div>
      <div class="hex">#16A34A</div>
    </div>
    <div class="row-item" style="background:rgba(217,119,6,0.05)">
      <div class="lbl"><span class="dot" style="background:#D97706"></span>Warning</div>
      <div><span class="sample" style="background:rgba(217,119,6,0.10); border-color:rgba(217,119,6,0.30); color:#D97706">Unsaved</span></div>
      <div class="hex">#D97706</div>
    </div>
    <div class="row-item" style="background:rgba(45,109,255,0.05)">
      <div class="lbl"><span class="dot" style="background:#2D6DFF"></span>Info</div>
      <div><span class="sample" style="background:rgba(45,109,255,0.10); border-color:rgba(45,109,255,0.30); color:#2D6DFF">Syncing…</span></div>
      <div class="hex">#2D6DFF</div>
    </div>
  </div>
</div></body></html>

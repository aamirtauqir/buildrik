<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .canvas-wrap {
    position: relative;
    background: #F8FAFC;
    background-image: radial-gradient(rgba(15,23,42,0.08) 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid var(--bd-border);
    border-radius: 12px;
    padding: 32px;
    min-height: 360px;
    overflow: hidden;
  }
  .artboard {
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(15,23,42,0.06), 0 2px 4px rgba(15,23,42,0.04);
    padding: 28px 32px;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
  }
  .artboard h2 { margin: 0 0 6px; font: 700 22px var(--bd-font); color: var(--bd-fg-heading); letter-spacing: -0.02em; }
  .artboard p  { margin: 0 0 14px; font: 400 13.5px var(--bd-font); color: var(--bd-fg-secondary); line-height: 1.6; }
  .artboard .block {
    background: var(--bd-bg-subtle);
    height: 64px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font: 500 11px var(--bd-mono); color: var(--bd-fg-muted);
    letter-spacing: 0.04em;
  }
  .selected {
    outline: 2px solid var(--bd-accent);
    outline-offset: 4px;
    box-shadow: 0 0 0 4px rgba(45,109,255,0.08);
    position: relative;
  }
  .selected::before {
    content: "section  ·  100% W"; position: absolute;
    top: -22px; left: -2px;
    background: var(--bd-accent); color: #fff;
    font: 500 10px var(--bd-mono); padding: 2px 6px;
    border-radius: 3px;
  }
  .size-badge {
    position: absolute; top: 8px; right: 12px;
    font: 500 10px var(--bd-mono); color: var(--bd-fg-muted);
    padding: 2px 6px; background: #fff; border: 1px solid var(--bd-border); border-radius: 4px;
  }
  .lbl { font-size: 10px; color: var(--bd-fg-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head><body><div class="card">
  <div class="lbl">Canvas · slate-50 + 20px dot grid · white artboards</div>
  <div class="canvas-wrap">
    <div class="artboard">
      <span class="size-badge">1440</span>
      <h2>Build sites visually.</h2>
      <p>Drag blocks onto the canvas. Edit in the inspector. Preview across breakpoints. Publish.</p>
      <div class="stack">
        <div class="block selected">section</div>
        <div class="block">columns-2</div>
        <div class="block">heading + paragraph</div>
      </div>
    </div>
  </div>

  <div class="lbl" style="margin-top:4px">Breakpoint previews</div>
  <div class="row" style="gap:12px; align-items:flex-start">
    <div class="canvas-wrap" style="flex:0 0 200px; padding:12px; min-height:auto">
      <div class="artboard" style="padding:12px; max-width:100%">
        <div class="size-badge" style="font-size:9px">375</div>
        <div class="block" style="height:28px; margin-bottom:6px">hero</div>
        <div class="block" style="height:24px; margin-bottom:6px">img</div>
        <div class="block" style="height:18px">btn</div>
      </div>
    </div>
    <div class="canvas-wrap" style="flex:0 0 320px; padding:16px; min-height:auto">
      <div class="artboard" style="padding:16px; max-width:100%">
        <div class="size-badge" style="font-size:10px">768</div>
        <div class="block" style="height:34px; margin-bottom:8px">hero</div>
        <div class="row" style="gap:6px"><div class="block" style="height:28px; flex:1">img</div><div class="block" style="height:28px; flex:1">copy</div></div>
      </div>
    </div>
  </div>
</div></body></html>

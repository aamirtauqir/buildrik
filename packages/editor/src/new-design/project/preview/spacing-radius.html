<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 10px 4px; }
  .r { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .shape { width: 80px; height: 48px; background: var(--bd-bg-card); border: 1px solid var(--bd-border-medium); box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
  .nm  { font: 600 11px var(--bd-font); color: var(--bd-fg-heading); }
  .px  { font: 500 10px var(--bd-mono); color: var(--bd-fg-muted); }
</style>
</head><body><div class="card">
  <div class="row">
    <div class="r"><div class="shape" style="border-radius:4px"></div><div class="nm">sm</div><div class="px">4px</div></div>
    <div class="r"><div class="shape" style="border-radius:8px"></div><div class="nm">md</div><div class="px">8px · default</div></div>
    <div class="r"><div class="shape" style="border-radius:12px"></div><div class="nm">lg</div><div class="px">12px</div></div>
    <div class="r"><div class="shape" style="border-radius:16px"></div><div class="nm">xl</div><div class="px">16px</div></div>
    <div class="r"><div class="shape" style="border-radius:9999px"></div><div class="nm">full</div><div class="px">9999 · pill</div></div>
  </div>
</div></body></html>

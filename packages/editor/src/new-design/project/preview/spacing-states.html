<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background: #F8FAFC; }
  .stack { display: flex; gap: 24px; align-items: center; padding: 10px; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .lbl { font: 500 10.5px var(--bd-mono); color: var(--bd-fg-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .pad { display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 14px; background: #fff; border: 1px solid var(--bd-border-medium);
    border-radius: 8px; font: 500 12px var(--bd-font); color: var(--bd-fg-primary); cursor: pointer;
    transition: all 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pad.base {}
  .pad.hov { background: var(--bd-bg-subtle); border-color: var(--bd-border-strong); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.08); }
  .pad.pre { background: rgba(15,23,42,0.06); }
  .pad.foc { border-color: var(--bd-accent); box-shadow: 0 0 0 3px rgba(45,109,255,0.12); }

  .abt { display:inline-flex; align-items:center; gap:8px; padding: 10px 16px; border-radius: 8px; background: var(--bd-accent); color: #fff; font: 500 13px var(--bd-font); cursor: pointer; }
  .abt.hov { background: var(--bd-accent-hover); }
  .abt.pre { background: var(--bd-accent-pressed); }
</style>
</head><body><div class="card">
  <div class="stack">
    <div class="demo"><div class="lbl">Default</div><div class="pad base">Preview</div></div>
    <div class="demo"><div class="lbl">Hover</div><div class="pad hov">Preview</div></div>
    <div class="demo"><div class="lbl">Pressed</div><div class="pad pre">Preview</div></div>
    <div class="demo"><div class="lbl">Focus</div><div class="pad foc">Preview</div></div>
    <div class="demo"><div class="lbl">Primary / hover / pressed</div>
      <div style="display:flex; gap:8px">
        <div class="abt">Publish</div>
        <div class="abt hov">Publish</div>
        <div class="abt pre">Publish</div>
      </div>
    </div>
  </div>
</div></body></html>

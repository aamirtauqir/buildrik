<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px;
    border: 0; border-radius: 9999px; cursor: pointer;
    font: 600 12.5px var(--bd-font);
    background: var(--bd-accent); color: #fff;
    transition: background 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .pill:hover    { background: var(--bd-accent-hover); }
  .pill:active   { background: var(--bd-accent-pressed); }
  .pill:focus-visible { outline: 0; box-shadow: 0 0 0 3px rgba(45,109,255,0.35); }
  .pill.busy     { background: var(--bd-accent-pressed); pointer-events:none; }
  .pill.disabled { background: var(--bd-border-medium); color: #fff; cursor: not-allowed; }
  .pill .sp {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    animation: spin 600ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .caret {
    display: inline-flex; align-items: stretch;
    border-radius: 9999px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(45,109,255,0.3);
  }
  .caret .pill { border-radius: 0; padding-right: 10px; box-shadow: none; }
  .caret .split {
    width: 30px; background: var(--bd-accent-pressed);
    color: #fff; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .caret .split:hover { background: #1a4eb8; }

  .flyout {
    margin-top: 6px; width: 280px;
    background: #fff; border: 1px solid var(--bd-border);
    border-radius: 10px; padding: 8px;
    box-shadow: 0 8px 32px rgba(15,23,42,0.08);
    display: flex; flex-direction: column; gap: 2px;
    font: 500 12px var(--bd-font);
  }
  .flyout .item {
    padding: 8px 10px; border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .flyout .item:hover { background: var(--bd-bg-subtle); }
  .flyout .kbd {
    font: 500 10px var(--bd-mono); color: var(--bd-fg-muted);
    padding: 1px 5px; background: var(--bd-bg-subtle); border-radius: 3px;
  }
  .flyout .sub { font: 400 11px var(--bd-font); color: var(--bd-fg-muted); }
  .url {
    margin-top: 6px; padding: 8px 10px;
    background: var(--bd-bg-subtle); border-radius: 6px;
    font: 500 11px var(--bd-mono); color: var(--bd-fg-primary);
    display: flex; justify-content: space-between; align-items: center;
  }

  .lbl { font-size: 10px; color: var(--bd-fg-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
</style>
</head><body><div class="card">
  <div class="lbl">States</div>
  <div class="row">
    <button class="pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-7 18 7-3 7 3z"/></svg>Publish</button>
    <button class="pill" style="background:var(--bd-accent-hover)">Hover</button>
    <button class="pill" style="background:var(--bd-accent-pressed)">Pressed</button>
    <button class="pill busy"><span class="sp"></span>Publishing&hellip;</button>
    <button class="pill disabled">No changes</button>
  </div>

  <div class="lbl" style="margin-top:16px">Split dropdown</div>
  <div class="row">
    <div class="caret">
      <button class="pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-7 18 7-3 7 3z"/></svg>
        Publish
      </button>
      <button class="split"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>

  <div class="lbl" style="margin-top:16px">Publish flyout</div>
  <div class="flyout">
    <div class="item"><span>Publish to web</span><span class="kbd">⌘⇧P</span></div>
    <div class="item"><span>Preview only</span><span class="kbd">⌘P</span></div>
    <div class="item"><div class="col" style="gap:2px"><span>Schedule&hellip;</span><span class="sub">Pick a date &amp; time</span></div></div>
    <div class="url">buildrik.app/shahg <span class="sub">copy ↗</span></div>
  </div>
</div></body></html>

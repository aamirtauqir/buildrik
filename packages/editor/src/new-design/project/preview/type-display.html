<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row2 { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--bd-border); }
  .row2:last-child { border-bottom: none; padding-bottom: 0; }
  .lab { font: 500 10.5px var(--bd-mono); color: var(--bd-fg-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .spec { color: var(--bd-fg-heading); }
  h1.s { font: 700 32px/1.2 var(--bd-font); letter-spacing: -0.02em; margin: 0; }
  h2.s { font: 600 24px/1.2 var(--bd-font); letter-spacing: -0.02em; margin: 0; }
  h3.s { font: 600 20px/1.2 var(--bd-font); letter-spacing: -0.02em; margin: 0; }
  h4.s { font: 600 16px/1.5 var(--bd-font); margin: 0; }
</style>
</head><body><div class="card">
  <div class="stack">
    <div class="row2"><div class="lab">H1 / 32 / 700</div><h1 class="s spec">Publish your site</h1></div>
    <div class="row2"><div class="lab">H2 / 24 / 600</div><h2 class="s spec">Section title</h2></div>
    <div class="row2"><div class="lab">H3 / 20 / 600</div><h3 class="s spec">Modal title</h3></div>
    <div class="row2"><div class="lab">H4 / 16 / 600</div><h4 class="s spec">Panel heading</h4></div>
  </div>
</div></body></html>

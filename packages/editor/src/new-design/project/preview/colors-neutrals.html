<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .n { display: flex; flex-direction: column; gap: 4px; }
  .chip {
    height: 56px; border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,0.06);
  }
  .nm  { font: 600 10px var(--bd-font); color: var(--bd-fg-heading); }
  .hex { font: 500 9.5px var(--bd-mono); color: var(--bd-fg-muted); }
  .title { font: 700 13px var(--bd-font); color: var(--bd-fg-heading); margin-bottom: 2px; }
  .subtitle { font: 500 11px var(--bd-font); color: var(--bd-fg-secondary); }
</style>
</head><body><div class="card">
  <div>
    <div class="title">Neutrals · Slate family</div>
    <div class="subtitle">All backgrounds, borders, and text in the editor come from this one ramp.</div>
  </div>
  <div class="scale">
    <div class="n"><div class="chip" style="background:#FFFFFF"></div><div class="nm">white</div><div class="hex">#FFFFFF</div></div>
    <div class="n"><div class="chip" style="background:#F8FAFC"></div><div class="nm">slate-50</div><div class="hex">#F8FAFC</div></div>
    <div class="n"><div class="chip" style="background:#F1F5F9"></div><div class="nm">slate-100</div><div class="hex">#F1F5F9</div></div>
    <div class="n"><div class="chip" style="background:#E2E8F0"></div><div class="nm">slate-200</div><div class="hex">#E2E8F0</div></div>
    <div class="n"><div class="chip" style="background:#CBD5E1"></div><div class="nm">slate-300</div><div class="hex">#CBD5E1</div></div>
    <div class="n"><div class="chip" style="background:#94A3B8"></div><div class="nm">slate-400</div><div class="hex">#94A3B8</div></div>
    <div class="n"><div class="chip" style="background:#64748B"></div><div class="nm">slate-500</div><div class="hex">#64748B</div></div>
    <div class="n"><div class="chip" style="background:#334155"></div><div class="nm">slate-700</div><div class="hex">#334155</div></div>
  </div>
</div></body></html>

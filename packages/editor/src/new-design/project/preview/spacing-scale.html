<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: flex; align-items: flex-end; gap: 8px; padding: 16px 8px; }
  .s { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--bd-accent); border-radius: 2px; width: 100%; min-width: 28px; }
  .lbl { font: 600 10px var(--bd-mono); color: var(--bd-fg-secondary); }
  .px  { font: 500 9.5px var(--bd-mono); color: var(--bd-fg-muted); }
</style>
</head><body><div class="card">
  <div class="ramp">
    <div class="s"><div class="bar" style="height:4px"></div><div class="lbl">1</div><div class="px">4</div></div>
    <div class="s"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="px">8</div></div>
    <div class="s"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="px">12</div></div>
    <div class="s"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="px">16</div></div>
    <div class="s"><div class="bar" style="height:20px"></div><div class="lbl">5</div><div class="px">20</div></div>
    <div class="s"><div class="bar" style="height:24px"></div><div class="lbl">6</div><div class="px">24</div></div>
    <div class="s"><div class="bar" style="height:32px"></div><div class="lbl">8</div><div class="px">32</div></div>
    <div class="s"><div class="bar" style="height:40px"></div><div class="lbl">10</div><div class="px">40</div></div>
    <div class="s"><div class="bar" style="height:48px"></div><div class="lbl">12</div><div class="px">48</div></div>
  </div>
</div></body></html>

<style>

:start;justify-items:center}.page{background:#fff;width:100%;max-width:850px;min-height:570px;box-shadow:0 5px 26px #34425b18;padding:28px}.site-nav{display:flex;justify-content:space-between;font-size:12px;margin-bottom:64px}.hero h2{font-size:clamp(24px,5cqw,50px);line-height:1.1;color:#233e70;max-width:600px}.hero p{font-size:16px;color:#657794;max-width:460px}.selected{outline:2px solid #527de9;outline-offset:8px;position:relative}.selected:before{content:'Heading · Home · base';position:absolute;top:-32px;left:-10px;font-size:11px;background:#245de5;color:#fff;padding:3px 6px}.inspector{width:300px;flex:none;background:white;border-left:1px solid var(--border);overflow:auto;padding:18px}.inspector .tabs{gap:0;justify-content:space-between;font-size:11px}.inspector .tabs button{padding:5px}.section{border-top:1px solid var(--border);padding-top:18px;margin-top:16px}.value{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:12px}.value input{width:90px}.token{color:#583f9a;background:#f1ecff}.previewbox{height:150px;border-radius:6px;background:linear-gradient(145deg,#dce7fc,#bccbe6);display:grid;place-items:center;color:#405c8f;margin-bottom:12px;font-size:20px}.modal{border:1px solid var(--border);border-radius:12px;width:min(720px,calc(100vw - 48px));max-height:calc(100dvh - 48px);padding:0;color:inherit;box-shadow:0 20px 80px #14243d44}.modal::backdrop{background:#14243d66}.modal header,.modal footer{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}.modal header h2{flex:1;margin:0}.modal footer{border-top:1px solid var(--border);border-bottom:0;justify-content:flex-end}.modal main{max-height:calc(100dvh - 200px);overflow:auto;padding:24px}.modal label{margin-bottom:12px}.compare{padding:24px;overflow:auto;background:#f6f8fb;height:100%}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.compare .page{min-height:400px}.toast{position:fixed;bottom:48px;left:50%;transform: <body><div class="app"><header class="top" aria-label="Global site actions"><strong class="site">◈ Northstar studio</strong><button id="settings" data-go="Settings">⚙ Site settings</button><span class="spec">Design specimen · synthetic data · no app writes</span><span class="spacer"></span><button data-task="History">History</button><button class="secondary" data-task="Notifications">Notifications</button><button id="more">More</button><button data-go="Preview">Preview</button><button class="primary" data-task="Publish">Publish</button></header><div class="middle"><nav class="rail" aria-label="Editor destinations"><button data-go="Editor" data-panel="Add"><i>＋</i>Add</button><button data-go="Editor" data-panel="Layers"><i>▱</i>Layers</button><button data-go="Assets"><i>▧</i>Assets</button><button data-go="CMS"><i>▤</i>CMS</button><button data-go="Brand"><i>◒</i>Brand</button><button data-go="Help" class="utility"><i>?</i>Help</button></nav><main class="work" id="work" tabindex="-1"></main></div><footer class="bottom" aria-label="Pages and save status"><button data-go="Pages">▤ Pages</button><button data-page="Home" id="page-home">Home</button><button data-page="About">About</button><button data-page="Contact">Contact</button><button class="status" data-task="Status" id="status">Document saved · demo</button></footer></div><dialog id="dialog" class="modal"></dialog><div class="toast hidden" role="status" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={module:'Editor',panel:'Layers',page:'Home',selected:'hero-heading',breakpoint:'Desktop',width:1440,zoom:50,task:null,tab:'Records',resource:'Designing a calmer homepage',search:'',recordTitle:'Designing a calmer homepage',draft:false,nav:false,compareSide:'A',inspector:true,sourcePicking:false,recordSummary:"How we make space for useful work.",taskDrafts:{AI:"",Review:""}};
let savedRecord={title:state.recordTitle,summary:state.recordSummary};const frames=[];let taskReturn=null;let lastFocus=null,pending=null;window.iaState=()=>({...state,frames:frames.length});
const btn=(label,attrs='')=>`<button ${attrs}>${label}</button>`;
const chip=(t,cls='')=>`<span class="tag ${cls}">${t}</span>`;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function push(){frames.push({state:{...state},focus:document.activeElement?.id||null})}
function back(){if(frames.length){const f=frames.pop();state=f.state;render();if(f.focus)document.getElementById(f.focus)?.focus();else $('#work').focus()}else navigate('Editor')}
function navigate(module,panel){const action=()=>{if(module==='Preview'&&state.module!=='Preview')push();state.module=module;state.panel=panel||state.panel;state.task=null;state.nav=false;if(module==='CMS')state.tab='Records';render();$('#work').focus()};if(state.draft&&module!==state.module){pending=action;guard()}else action()}
function contextual(module){push();state.module=module;state.task=null;render();$('#work').focus()}
function task(t,opener=document.activeElement){if(!state.task)taskReturn=opener?{id:opener.id,task:opener.dataset?.task}:null;state.task=t;render();$('#task-close')?.focus()}
function closeTask(){state.task=null;render();const o=taskReturn;taskReturn=null;const el=o?.id?document.getElementById(o.id):o?.task?document.querySelector('[data-task="'+CSS.escape(o.task)+'"]'):null;(el||$('#work')).focus()}
function modal(title,body,footer){lastFocus=document.activeElement?.id;$('#dialog').innerHTML=`<header><h2>${title}</h2>${btn('Close','id="modal-x"')}</header><main>${body}</main><footer>${footer||btn('Done','id="modal-done"')}</footer>`;$('#dialog').showModal();$('#dialog').querySelector('input,select,button')?.focus()}
function closeModal(){if($('#dialog').open)$('#dialog').close();if(lastFocus)document.getElementById(lastFocus)?.focus()}
function guard(){modal('Keep this record draft?',`<p><strong>CMS · Journal · ${esc(state.recordTitle)}</strong></p><p>This is an unapplied record draft. Choose what to do before changing workspaces.</p>`,btn('Stay','id="guard-stay"')+btn('Discard draft','id="guard-discard"')+btn('Save and leave · simulate','id="guard-save" class="primary"'))}
function head(title,scope,actions=''){return `<div class="workspace-head">${btn('☰ Navigation','class="local-nav-toggle" id="nav-toggle"')}${frames.length?btn('← Back','id="context-back"'):''}<div class="identity"><h1>${title}</h1><small>${scope}</small></div>${actions}</div>`}
const navItems={CMS:['Collections','Journal','Team','Data sources','Site variables','Conditions'],Assets:['All assets','Recent','Used on this site','No known page placements','My folders','Fonts'],Brand:['Colours','Typography','Spacing','Other token kinds','Type styles / presets','Classes','Dark mode','Checks','Starters','Import / export'],Components:['This page','This site','Workspace library'],Settings:['General','Languages','SEO','Domains','Redirects','Access','Analytics','Form submissions','Custom code','Security headers','Danger zone','Workspace doors'],Templates:['All templates','Landing pages','Portfolio','Saved templates']};
function resource(module,title,scope,body,detail='',actions='',foot=''){const nav=(navItems[module]||[]).map((t,i)=>btn(esc(t),`data-local="${esc(t)}" class="${i===0?'active':''}"`)).join('');return `<section class="workspace" aria-label="${module} workspace"><nav class="nav ${state.nav?'open':''}" aria-label="${module} navigation"><h2>${module}</h2>${nav}<p class="muted" style="margin-top:24px">Current site<br><strong>Northstar studio</strong></p></nav><div class="content">${head(title,scope,actions)}<div class="workspace-body">${body}</div>${foot?`<footer class="workspace-foot">${foot}</footer>`:''}</div>${detail?`<aside class="detail" aria-label="${module} detail">${detail}</aside>`:''}</section>`}
function inspector(){return `<aside class="inspector" aria-label="Inspector"><div class="row space"><strong>Heading</strong>${chip('Element')}</div><p class="muted">Home / Hero / Heading</p><div class="tabs">${['Content','Style','Behaviour','Effects'].map(x=>btn(x,`class="${x==='Style'?'active':''}" data-demo="Inspector ${x} remains specified in FD-INS-02/03"`)).join('')}</div><p>${chip(state.breakpoint)} ${chip('Base styles')}</p><div class="section"><h3>Typography</h3><div class="value">Font ${btn('Inter','data-demo="Font picker returns to this exact property"')}</div><div class="value">Size <input aria-label="Font size" value="48" readonly></div><div class="value">Colour ${btn('Brand / ink','id="open-token" class="token"')}</div><p class="muted">Linked to a site token. Editing its definition affects all usages.</p></div><div class="section"><h3>Spacing</h3><div class="value">Padding <input value="0" aria-label="Padding" readonly></div></div><div class="section">${btn('Open AI','data-task="AI"')}</div></aside>`}
function editor(){let left=state.panel==='Add'?`<h2>Add</h2><label><span class="visually-hidden">Search Add</span><input placeholder="Search elements and blocks"></label>${['Elements','Blocks','Catalog components'].map(x=>btn(x,'data-demo="All existing insertion contracts remain available"')).join(' ')}<div class="section"><h3>Saved components</h3>${btn('Manage components','id="open-components"')}<p class="muted">Reusable definitions from this workspace.</p></div><div class="section">${btn('Templates','data-go="Templates"')}${btn('Generate a block','id="generate"')}</div>`:`<h2>Layers</h2><input aria-label="Search layers" placeholder="Search this page"><div class="tree">⌄ ${esc(state.page)}</div><div class="tree sub">⌄ Hero</div><button class="tree sub active" id="select-heading" style="width:100%;text-align:left">H1 A clearer place to create</button><div class="tree sub">Text · Introduction</div><div class="tree sub">Button · Start a project</div><p class="muted" style="margin-top:24px">Selection is shared with canvas and Inspector.</p>`;
if(state.panel==='Asset picker')left=`<h2>Place an asset</h2><div class="notice">Insert image · ${esc(state.page)} / after Hero</div><input aria-label="Search assets for placement" placeholder="Search your assets"><div class="previewbox">Studio image</div>${btn('Insert selected image','data-demo="Captured parent/index, permission and nesting validated before one document transaction"')}${btn('Cancel / Back to library','id="context-back"')}<p class="muted">Canvas stays visible for precise drop. Keyboard Choose uses the same target validation. Upload and placement are separate operations.</p>`;return `<section class="workspace" aria-label="Editor workspace"><aside class="editor-left">${left}</aside><div class="canvas"><div class="canvas-tools">${btn('↶','aria-label="Undo" data-demo="Document Undo; disabled for unapplied service drafts"')}${btn('↷','aria-label="Redo" data-demo="Document Redo"')}<span class="muted">${esc(state.page)} › Heading</span><span class="spacer"></span><div class="row viewset">${['Desktop','Tablet','Mobile'].map(b=>btn(b,`data-device="${b}" class="${state.breakpoint===b?'active':''}"`)).join('')}<input id="width" aria-label="Website viewport width in pixels" value="${state.width}" inputmode="numeric">px ${btn(state.zoom+'%','id="zoom"')}${btn('Fit','id="fit"')}${btn('View','data-demo="Guides, grid, spacing, X-ray and device frame; view only"')}</div></div>${state.sourcePicking?`<div class="notice row">Choose source for workspace component. ${btn('Return to component review','id="source-return" class="primary"')}${btn('Cancel','id="source-cancel"')}</div>`:''}<div class="stage"><article class="page"><div class="site-nav"><strong>NORTHSTAR</strong><span>Work　About　Contact</span></div><div class="hero"><h2 class="selected">A clearer place<br>to create.</h2><p>Thoughtful websites, built around the work that matters.</p><button class="primary">Start a project</button></div><div class="previewbox" style="margin-top:36px">Project image</div></article></div></div>${state.inspector&&!state.task?inspector():''}${state.task?'<div class="task-reserve" aria-hidden="true"></div>':''}</section>`}
function cms(){const tabs=`<div class="tabs">${['Records','Fields','Dynamic pages','Collection settings'].map(t=>btn(t,`data-cms-tab="${t}" class="${state.tab===t?'active':''}"`)).join('')}</div>`;let body='';
if(state.tab==='Record'){body=`<div class="notice">Record draft · changes apply to this record only. Published means eligible for the next site publish.</div><form class="form" onsubmit="return false"><label>Title<input id="record-title" value="${esc(state.recordTitle)}"></label><label>Slug<input value="designing-a-calmer-homepage" readonly></label><label>Summary<textarea id="record-summary">${esc(state.recordSummary)}</textarea></label><div class="formgrid"><label>Category<select><option>Design</option><option>Process</option></select></label><label>Status<select><option>Draft</option><option>Published — eligible for output</option></select></label></div></form>`;return resource('CMS','Edit record','Journal / '+esc(state.recordTitle),body,'',btn('← Records','id="record-back"'),`${btn('Preview draft fields','data-demo="Local draft preview; does not save or publish"')}${btn('Cancel','id="record-cancel"')}<span class="spacer"></span><small>${state.draft?'Unsaved record draft':'Demo record loaded'}</small>${btn('Save record · simulate','id="record-save" class="primary"')}`)}
if(state.tab==='Records')body=`<div class="toolbar"><input id="resource-search" aria-label="Search records" placeholder="Search Journal" value="${esc(state.search)}">${btn('Filter','data-demo="Record filter is workspace state"')}${btn('Import','id="cms-import"')}</div><div class="tablewrap"><table><thead><tr><th>Title</th><th>Status</th><th>Updated</th></tr></thead><tbody>${[state.recordTitle,'Designing with reusable sections','A guide to better content'].filter(t=>t.toLowerCase().includes(state.search.toLowerCase())).map((t,i)=>`<tr><td>${btn(esc(t),`data-record="${i}"`)}</td><td>${chip(i===1?'Draft':'Published')}</td><td>Today</td></tr>`).join('')}</tbody></table></div>`;
else if(state.tab==='Fields')body=`<div class="notice">Schema changes affect records and connected elements. Field keys and types are locked when referenced.</div>${['Title · text · required','Slug · slug · required','Summary · textarea','Category · reference'].map(t=>`<div class="listrow"><strong>${t}</strong>${btn('Inspect field','data-demo="Usage/constraints/key/source receipt shown in field detail"')}</div>`).join('')}`;
else if(state.tab==='Dynamic pages')body=`<div class="form"><div class="notice">Schema, content and presentation have separate owners.</div><label>Template page<select><option>Journal template</option></select></label><label>URL pattern<input value="/journal/{slug}" readonly></label>${btn('Edit template on canvas','id="template-canvas"')}<p class="muted">Only eligible records with unique valid URLs are included in the next site publish.</p>${btn('Save dynamic-page settings','data-demo="Requires a confirmed CMS service receipt"')}</div>`;
else body=`<div class="form"><label>Collection name<input value="Journal"></label><div class="warning notice">Deleting a collection requires an impact review of records, bindings and generated pages.</div>${btn('Review deletion impact','data-demo="Confirm only after complete dependency and permission preflight"')}</div>`;
return resource('CMS','Journal','CMS / Collections · site-owned content',tabs+body,'',btn('New record','id="new-record" class="primary"'))}

function render(){const fn={Editor:editor,CMS:cms,Assets:assets,Brand:brand,Components:components,Settings:settings,Pages:pages,Templates:templates,Compare:compare,TimeTravel:timeTravel,Help:help};let html=state.module==='Preview'?`<section class="content" style="height:100%">${head('Preview','Scriptless visual preview · not a publish or delivery test',btn('Return to '+(frames.at(-1)?.state.module||'Editor'),'data-back'))}<div class="workspace-body"><article class="page"><h1>A clearer place to create.</h1><p>Website viewport ${state.width}px · ${state.breakpoint}</p></article></div></section>`:(fn[state.module]||editor)();if(state.task)html+=`<aside class="task" aria-label="${state.task} task"><header><h2>${state.task}</h2>${btn('Close','id="task-close"')}</header><div class="taskbody">${taskContent(state.task)}</div><footer><small>Origin: ${state.module} · ${state.page}. Close preserves context.</small></footer></aside>`;$('#work').innerHTML=html;if(state.task&&state.module!=='Editor'){const bg=$('#work').firstElementChild;if(bg&&!bg.classList.contains('task'))bg.inert=true}document.querySelectorAll('.rail [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===state.module&&(b.dataset.go!=='Editor'||b.dataset.panel===state.panel)));$('#status').textContent=state.draft?'Record draft unsaved · document saved':'Document saved · demo';$('#page-home').classList.toggle('active',state.page==='Home')}
document.addEventListener('input',e=>{if(e.target.id==='record-title'){state.recordTitle=e.target.value;state.draft=true;$('#status').textContent='Record draft unsaved · document saved'}if(e.target.id==='record-summary'){state.recordSummary=e.target.value;state.draft=true}if(e.target.id==='ai-prompt')state.taskDrafts.AI=e.target.value;if(e.target.id==='review-reply')state.taskDrafts.Review=e.target.value;if(e.target.id==='resource-search'){state.search=e.target.value;const start=e.target.selectionStart;render();$('#resource-search').focus();$('#resource-search').setSelectionRange(start,start)}});

if(d.go)return navigate(d.go,d.panel);if(d.task)return task(d.task,b);if(d.demo)return toast(d.demo);if(d.page){const go=()=>{state.page=d.page;state.selected='hero-heading';navigate('Editor')};if(state.draft){pending=go;guard()}else go();return}if(d.device){state.breakpoint=d.device;state.width={Desktop:1440,Tablet:768,Mobile:375}[d.device];render();return}if(d.record!==undefined){state.tab='Record';render();return}if(d.cmsTab){if(state.draft&&state.tab==='Record'){pending=()=>{state.tab=d.cmsTab;render()};guard()}else{state.tab=d.cmsTab;render()}return}if(d.side){state.compareSide=d.side;render();return}if(d.local){if(d.local==='Form submissions'){modal('Form submissions',`<p>Site settings → Form submissions</p><div class="notice">Server records; separate from document Undo.</div>${btn('Configure in Inspector','id="configure-form"')}${btn('Export site submissions CSV','data-demo="Exports all site submissions, not just visible filtered rows"')}<div class="tabs">${['Inbox','Spam','Archived'].map(x=>btn(x,'data-demo="Spam/Archived expose Unspam/Unarchive"')).join('')}</div><p>Submission details, pagination and permanent confirmed Delete stay available.</p>`);return}if(d.local==='Site variables'||d.local==='Data sources'||d.local==='Conditions'){modal(d.local,`<p>${d.local==='Data sources'?'Sources currently last for this session.':d.local==='Conditions'?'Read-only conditions index. Canonical editing: exact element → Inspector Content → Conditions. Preserve legacy expressions until validated migration. BD-20 full dynamic-system direction is approved; detailed evaluator/output design is still proposed.':'Site string variables are document settings; empty string is valid.'}</p>`);return}toast(d.local+' — exact controls and states are specified in the linked handoff.');return}
if(['modal-close','modal-done','modal-x'].includes(id))return closeModal();if(id==='context-back'||b.hasAttribute('data-back'))return back();if(['task-close','ai-back'].includes(id))return closeTask();if(id==='nav-toggle'){state.nav=!state.nav;render();return}if(id==='open-token')return contextual('Brand');if(id==='open-components')return contextual('Components');if(id==='fit'){state.zoom=40;render();toast('Fit changed canvas zoom only. Website viewport remains '+state.width+'px.');return}if(id==='zoom'){state.zoom=state.zoom===50?100:50;render();return}

if(id==='compare'||id==='time-travel'){push();state.module=id==='time-travel'?'TimeTravel':'Compare';state.task=null;render();return}if(id==='locate'||id==='template-canvas'){contextual('Editor');return}if(id==='asset-place'){push();state.module='Editor';state.panel='Asset picker';state.task=null;render();return}if(id==='component-source'){push();state.module='Editor';state.task=null;state.sourcePicking=true;render();return}if(id==='source-return'||id==='source-cancel'){back();if(id==='source-return')toast('Source captured for review; component definition unchanged.');return}
